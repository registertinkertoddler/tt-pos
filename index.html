  const newTotal = returnNewItemsTotal();
  const net = returnNetAmount();
  return `<div class="modal-backdrop">
    <div class="modal" style="max-width:520px">
      <h2 style="margin-top:0">🔁 退货 / 换货</h2>
      <p class="hint">原始交易:${fmtDateTime(sale.timestamp)} · 收银员:${esc(sale.cashier)} · 处理人:${esc(state.returnStaff?state.returnStaff.name:'')}</p>
      <div class="section-title">选择要退回的商品</div>
      ${state.returnItems.map(it => `
        <div class="cart-row">
          <div><div class="cart-item-name">${esc(it.name)}</div><div class="cart-item-sub">${esc(it.sku)} · 單價 ${money(it.unitPrice)} · 剩餘可退 ${it.maxQty} 件${it.alreadyReturned>0?` · 已退 ${it.alreadyReturned} 件`:''}</div></div>
          <div class="qty-ctrl"><button class="qty-btn" onclick="changeReturnQty('${escAttr(it.sku)}',-1)" ${it.maxQty===0?'disabled':''}>−</button><div class="qty-val">${it.returnQty}</div><button class="qty-btn" onclick="changeReturnQty('${escAttr(it.sku)}',1)" ${it.maxQty===0?'disabled':''}>+</button></div>
          <div class="num">${it.maxQty===0?'<span class="hint" style="margin:0">已退完</span>':'退 '+money(it.unitPrice*it.returnQty)}</div>
        </div>`).join('')}
      <div class="summary-row"><div>退货金额</div><div class="val">−${money(refund)}</div></div>

      <div class="section-title">加入新商品(换货,选填)</div>
      <div class="scan-box">
        <input id="return-new-item-input" placeholder="输入 SKU 後按 Enter 加入" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault(); addReturnNewItem(this.value.trim()); this.value='';}">
        <button class="btn btn-primary" onclick="addReturnNewItem(document.getElementById('return-new-item-input').value.trim()); document.getElementById('return-new-item-input').value='';">加入</button>
      </div>
      ${state.returnNewCart.map(it => `
        <div class="cart-row">
          <div><div class="cart-item-name">${esc(it.name)}</div><div class="cart-item-sub">${esc(it.sku)} · 单价 ${money(it.price)}</div></div>
          <div class="qty-ctrl"><button class="qty-btn" onclick="changeReturnNewQty('${escAttr(it.sku)}',-1)">−</button><div class="qty-val">${it.qty}</div><button class="qty-btn" onclick="changeReturnNewQty('${escAttr(it.sku)}',1)">+</button></div>
          <div class="num">${money(it.price*it.qty)}</div>
        </div>`).join('')}
      ${state.returnNewCart.length>0 ? `<div class="summary-row"><div>新商品金额</div><div class="val">+${money(newTotal)}</div></div>` : ''}

      <div class="summary-row total"><div>${net<0?'退还客户':net>0?'客户需补':'两不找'}</div><div class="val">${money(Math.abs(net))}</div></div>
      ${sale.memberId ? (() => {
        const member = state.members.find(m => m.id === sale.memberId);
        if (!member) return '';
        const ratio = sale.total ? Math.min(1, refund / Math.abs(sale.total)) : 0;
        const earnedReversal = Math.round((sale.pointsEarned||0) * ratio);
        const redeemedRefund = Math.round((sale.pointsRedeemed||0) * ratio);
        const rates = getMemberRates(member);
        const newItemsEarned = net > 0 ? Math.floor(net * (rates.earnRate||0)) : 0;
        const delta = newItemsEarned - earnedReversal + redeemedRefund;
        return `<p class="hint">会员 ${esc(member.name)} 积分预计调整:<b style="color:${delta>=0?'var(--teal-deep)':'var(--danger)'}">${delta>=0?'+':''}${delta}</b>(目前 ${member.points} 分)</p>`;
      })() : ''}

      ${net!==0 ? `
        <div class="section-title">结算方式${net<0?'(退还给客户)':'(客户支付)'}</div>
        <div class="pay-grid">
          <div class="pay-opt" onclick="addReturnPaymentLine('Cash')">+ Cash</div>
          <div class="pay-opt" onclick="addReturnPaymentLine('Credit Card')">+ Credit Card</div>
          <div class="pay-opt" onclick="addReturnPaymentLine('Debit Card')">+ Debit Card</div>
          <div class="pay-opt" onclick="addReturnPaymentLine('E-wallet')">+ E-wallet</div>
          ${sale.memberId ? `<div class="pay-opt" onclick="addReturnPaymentLine('Store Credit')">+ Store Credit</div>` : ''}
        </div>
        ${state.returnPaymentLines.length>0 ? state.returnPaymentLines.map((l,i) => `
          <div class="cart-row">
            <div class="cart-item-name">${esc(l.method)}</div>
            <div><input type="text" inputmode="decimal" value="${l.amount}" style="width:88px;text-align:right;padding:6px 8px" onchange="updateReturnPaymentLineAmount(${i}, this.value)"></div>
            <button class="btn-danger" onclick="removeReturnPaymentLine(${i})">×</button>
          </div>`).join('') : ''}
        <div class="summary-row"><div>已结算</div><div class="val">${money(returnPaymentLinesSum())}</div></div>
        ${returnPaymentRemaining()>0.001 ? `<div class="summary-row" style="color:var(--danger);font-weight:800"><div>还差</div><div class="val">${money(returnPaymentRemaining())}</div></div>` : ''}
      ` : ''}

      <button class="btn btn-danger-solid btn-full btn-lg" style="margin-top:16px" onclick="submitReturnExchange()" ${(state.returnItems.every(it=>it.returnQty===0) && state.returnNewCart.length===0) || (net!==0 && returnPaymentRemaining()>0.001) || state.returnSubmitting?'disabled':''}>${state.returnSubmitting?'处理中…':'确认'+(state.returnNewCart.length>0?'换货':'退货')}</button>
      <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="cancelReturnModal()">取消</button>
    </div>
  </div>`;
}
async function submitReturnExchange() {
  if (state.returnSubmitting) return; // 防止连续点击造成重複退货/换货
  const openShift = getOpenShift();
  if (!openShift) return showToast('目前没有进行中的班次,无法处理退货/换货', true);
  const returned = state.returnItems.filter(it => it.returnQty > 0);
  if (returned.length===0 && state.returnNewCart.length===0) return showToast('请选择退回的商品或加入新商品', true);
  const net = returnNetAmount();
  if (Math.abs(net) > 0.001 && returnPaymentRemaining() > 0.001) return showToast('结算金额还没凑齐', true);
  state.returnSubmitting = true;
  renderTab();
  const items = [
    ...returned.map(it => ({ sku:it.sku, name:it.name, qty:-it.returnQty, unitPrice:it.unitPrice, promo:false, commission:it.commission })),
    ...state.returnNewCart.map(it => ({ sku:it.sku, name:it.name, qty:it.qty, unitPrice:it.price, promo:false, commission:it.commission })),
  ];
  const commissionTotal = items.reduce((sum,it) => sum + it.commission*it.qty, 0);
  const refund = returnRefundAmount();
  const type = state.returnNewCart.length>0 ? 'exchange' : 'return';
  const origSale = state.returnOrigSale;
  const sign = net < 0 ? -1 : 1;
  const payments = state.returnPaymentLines.map(l => ({ method:l.method, amount: round2(l.amount * sign) }));

  // ---- 会员积分自动调整 ----
  let pointsEarnedField = 0, pointsRedeemedField = 0;
  const member = origSale.memberId ? state.members.find(m => m.id === origSale.memberId) : null;
  if (member) {
    const ratio = origSale.total ? Math.min(1, refund / Math.abs(origSale.total)) : 0;
    const earnedReversal = Math.round((origSale.pointsEarned||0) * ratio);   // 按退货比例扣回原本赚的积分
    const redeemedRefund = Math.round((origSale.pointsRedeemed||0) * ratio); // 按退货比例退回原本用掉的积分
    const rates = getMemberRates(member);
    const newItemsEarned = net > 0 ? Math.floor(net * (rates.earnRate||0)) : 0; // 换货多付的部分,按目前等级正常赚积分
    pointsEarnedField = newItemsEarned - earnedReversal;
    pointsRedeemedField = -redeemedRefund;
  }

  const record = {
    // 佣金一律归属原始销售的员工,不是现场处理退货的人;processedBy 另外记录谁实际操作这次退货/换货
    id:'ret_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), timestamp:new Date().toISOString(), shiftId: openShift.id, transactionNumber: generateTransactionNumber(type),
    cashier: origSale.cashier, cashierId: origSale.cashierId, commissionStaff: origSale.commissionStaff, commissionStaffId: origSale.commissionStaffId,
    commissionTotal, items, subtotal: net, discount:0, cashRoundingAdj:0, total: net,
    payMethod: payments[0]?payments[0].method:'—', payments, cashTendered:null, changeGiven:null,
    memberId: origSale.memberId||null, memberName: origSale.memberName||null, pointsEarned: pointsEarnedField, pointsRedeemed: pointsRedeemedField,
    type, refSaleId: origSale.id, processedBy: state.returnStaff.name,
  };
  state.sales.push(record);
  let memberBackup = null;
  if (member) {
    memberBackup = { ...member };
    member.points = Math.max(0, member.points - pointsRedeemedField + pointsEarnedField);
    member.totalSpend = Math.max(0, (member.totalSpend||0) + net);
    // Store Credit 结算:退款方向(net<0)發放/增加餘额;客户补款方向(net>0)扣除已使用的餘额
    for (const p of payments) {
      if (p.method === 'Store Credit') member.storeCredit = Math.max(0, (member.storeCredit||0) - p.amount);
    }
    maybeUpgradeTier(member);
  }
  try {
    await gasUpsert('Sales', saleToRow(record));
    if (member) await gasUpsert('Members', memberToRow(member));
    if (payments.some(p=>p.method==='Cash') && net !== 0) printReturnSlip(record);
    showToast((type==='exchange'?'换货':'退货')+'处理完成 ✓'+(member?` · 积分调整 ${pointsEarnedField-pointsRedeemedField>=0?'+':''}${pointsEarnedField-pointsRedeemedField}`:''));
    cancelReturnModal();
  } catch(e) { state.returnSubmitting = false; state.sales.pop(); if (memberBackup) Object.assign(member, memberBackup); showToast('保存失败', true); renderTab(); }
}
function printReturnSlip(record) {
  const w58 = state.config.paperWidth === '58';
  const docTitle = record.type==='exchange' ? 'Exchange Receipt' : 'Refund Receipt';
  const itemsHtml = record.items.map(it => `<div class="rc-line"><div>${it.qty<0?'退':'加'} ${esc(it.name)}</div><div>${it.qty<0?'−':''}${money(Math.abs(it.qty*it.unitPrice))}</div></div>`).join('');
  const html = `
    <div class="receipt-paper ${w58?'w58':''}">
      <div class="rc-title">${esc(state.config.shopName)}</div>
      ${state.config.addressLine1?`<div class="rc-sub">${esc(state.config.addressLine1)}</div>`:''}
      ${state.config.addressLine2?`<div class="rc-sub">${esc(state.config.addressLine2)}</div>`:''}
      ${state.config.addressLine3?`<div class="rc-sub">${esc(state.config.addressLine3)}</div>`:''}
      ${state.config.phone?`<div class="rc-sub">Tel: ${esc(state.config.phone)}</div>`:''}
      <div class="rc-sub" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:4px">${esc(docTitle)}</div>
      <div style="margin-top:8px;text-align:left">
        <div>Receipt no. : ${esc(record.transactionNumber||'')}</div>
        <div>Ref : ${esc(state.returnOrigSale?state.returnOrigSale.transactionNumber:'')}</div>
        <div>Date : ${fmtDateTimeWithYear(record.timestamp)}</div>
        <div>Cashier : ${esc(record.processedBy||record.cashier)}</div>
      </div>
      <hr>${itemsHtml}<hr>
      <div class="rc-line rc-total"><div>${record.total<0?'退还客户':'客户补付'}</div><div>${money(Math.abs(record.total))}</div></div>
      <hr>
      <div class="rc-foot">Thank You and please come again!</div>
      <div class="rc-foot" style="margin-top:6px;text-align:left">We are happy to replace or exchange products return within 3 days from the purchase date as long as it's returned in it's original packaging, unused, sellable condition and in good time. No cash refund.</div>
    </div>`;
  const el = document.getElementById('receipt-print');
  if (el) el.innerHTML = html;
  printReceiptViaIminOrBrowser(record, false);
}
function submitEditAuth(barcode) {
  const staff = findStaffByBarcode(barcode);
  if (!staff) return showToast('找不到这个工卡编号', true);
  if (state.editAuthRequireManager && staff.role !== 'manager') return showToast('这个操作需要店长权限', true);
  const targetId = state.pendingEditSku;
  const action = state.editAuthAction;
  state.editAuthOpen = false; state.pendingEditSku = null; state.editAuthAction = null; state.editAuthRequireManager = false; state.scanBuffers.editAuth = '';
  state.editingStaff = staff;
  if (action === 'productEdit') { startEditProduct(targetId); }
  else if (action === 'productDelete') { doRemoveProduct(targetId); }
  else if (action === 'memberEdit') { state.memberDetailId = targetId; state.memberEditMode = true; renderTab(); }
  else if (action === 'memberDelete') { removeMember(targetId); }
}
function renderEditAuthModal() {
  if (!state.editAuthOpen) return '';
  const title = state.editAuthRequireManager ? '🔒 需要店长扫工卡授权' : '🔒 扫工卡才能编辑';
  const hint = state.editAuthRequireManager ? '这是敏感操作(佣金/删除),只有店长身份的工卡可以授权。' : '修改资料需要先验证身份,系统会记录是谁修改的。';
  return `<div class="modal-backdrop" onclick="if(event.target===this) cancelEditAuth()">
    <div class="modal">
      <h2 style="margin-top:0">${title}</h2>
      <p class="hint">${hint}</p>
      <div class="field">${renderScanField('editAuth','扫描 barcode',true)}</div>
      <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="cancelEditAuth()">取消</button>
    </div>
  </div>`;
}
function startEditProduct(sku) {
  state.editingSku = sku;
  renderTab();
  const card = document.getElementById('product-form-card');
  if (card && card.scrollIntoView) card.scrollIntoView({ behavior:'smooth', block:'start' });
}
function cancelEditProduct() { state.editingSku = null; state.editingStaff = null; renderTab(); }
async function updateProduct() {
  const sku = state.editingSku;
  const p = state.products.find(x => x.sku === sku);
  if (!p) return;
  const brand = document.getElementById('p-brand').value.trim();
  const name = document.getElementById('p-name').value.trim();
  const price = parseFloat(document.getElementById('p-price').value);
  const promoRaw = document.getElementById('p-promo').value; const promoPrice = promoRaw!==''?parseFloat(promoRaw):null;
  const commissionType = document.getElementById('p-commission-type').value;
  const commission = parseFloat(document.getElementById('p-commission').value) || 0;
  if (!name || isNaN(price)) return showToast('请填写名称与原价', true);
  const prev = { ...p };
  const editedBy = state.editingStaff ? state.editingStaff.name : '';
  const editedAt = new Date().toISOString();
  Object.assign(p, { brand, name, price, promoPrice, promoActive: promoPrice!=null ? p.promoActive : false, commissionType, commission, editedBy, editedAt });
  try { await gasUpsert('Products', productToRow(p)); showToast('已更新产品 ✓ · '+editedBy); state.editingSku = null; state.editingStaff = null; renderTab(); }
  catch(e) { Object.assign(p, prev); showToast('保存失败', true); renderTab(); }
}
async function addBarcode(sku) {
  const input = document.getElementById('add-bc-'+sku); const val = input.value.trim();
  if (!val) return showToast('请输入barcode', true);
  const p = state.products.find(pr=>pr.sku===sku); if (!p) return;
  p.barcodes = p.barcodes || [];
  if (p.barcodes.includes(val)) return showToast('这个barcode已经存在', true);
  const conflict = state.products.find(pr => pr.sku!==sku && (pr.barcodes||[]).includes(val));
  if (conflict) return showToast('这个barcode已经用在别的产品('+conflict.sku+')', true);
  p.barcodes.push(val);
  try { await gasUpsert('Products', productToRow(p)); showToast('已新增barcode ✓'); renderTab(); } catch(e) { p.barcodes.pop(); showToast('保存失败', true); }
}
async function removeBarcode(sku, barcode) {
  const p = state.products.find(pr=>pr.sku===sku); if (!p) return;
  const idx = p.barcodes.indexOf(barcode); if (idx===-1) return;
  p.barcodes.splice(idx,1);
  try { await gasUpsert('Products', productToRow(p)); showToast('已移除barcode'); renderTab(); } catch(e) { p.barcodes.splice(idx,0,barcode); showToast('保存失败', true); }
}
async function togglePromo(sku, checked) {
  const p = state.products.find(pr=>pr.sku===sku); if (!p) return; const prev = p.promoActive; p.promoActive = checked;

function downloadProductTemplate() {

    { brand:'Firgi', sku:'FG-POT-01', barcodes:'6912345678901', name:'不沾锅 20cm', price:129, promoPrice:99, commissionType:'percent', commission:5 },

async function handleProductImport(input) {
  const file = input.files[0]; if (!file) return;
  const resultEl = document.getElementById('product-import-result');
  resultEl.innerHTML = '<div class="hint">正在解析…</div>';
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    let added = 0, updated = 0, skipped = 0;
    const touched = [];
    for (const r of rows) {
      const sku = String(r.sku || r.SKU || '').trim();
      const name = String(r.name || r.Name || '').trim();
      const price = parseFloat(r.price ?? r.Price);
      if (!sku || !name || isNaN(price)) { skipped++; continue; }
      const brand = String(r.brand || r.Brand || '').trim();
      const promoRaw = r.promoPrice ?? r.promo_price ?? r.PromoPrice ?? '';
      const promoPrice = promoRaw !== '' && !isNaN(parseFloat(promoRaw)) ? parseFloat(promoRaw) : null;
      const commission = parseFloat(r.commission ?? r.Commission) || 0;
      const commissionTypeRaw = String(r.commissionType || r.commission_type || r.CommissionType || 'fixed').trim().toLowerCase();
      const commissionType = commissionTypeRaw === 'percent' || commissionTypeRaw === '%' ? 'percent' : 'fixed';
      const barcodesRaw = String(r.barcodes || r.Barcodes || r.barcode || '').trim();
      const barcodes = barcodesRaw ? barcodesRaw.split(',').map(b=>b.trim()).filter(Boolean) : [];
      const existing = state.products.find(p => p.sku === sku);
      if (existing) { Object.assign(existing, { brand, name, price, promoPrice, promoActive: promoPrice!=null, commission, commissionType, barcodes: barcodes.length?barcodes:(existing.barcodes||[]) }); updated++; touched.push(productToRow(existing)); }
      else { const p = { brand, sku, name, price, promoPrice, promoActive: promoPrice!=null, commission, commissionType, barcodes }; state.products.push(p); added++; touched.push(productToRow(p)); }
    }
    await gasBulkUpsert('Products', touched);
    resultEl.innerHTML = `<div class="hint" style="color:var(--teal-deep);font-weight:700">✓ 新增 ${added} 笔,更新 ${updated} 笔${skipped>0?`,略过 ${skipped} 笔(缺少SKU/名称/原价)`:''}</div>`;
    showToast('匯入完成 ✓'); renderTab();
  } catch (e) {
    resultEl.innerHTML = '<div class="hint" style="color:var(--danger)">解析失败,请确认档案格式是否正确</div>';
    showToast('匯入失败', true);
  }
  input.value = '';
}
async function doRemoveProduct(sku) {
  const idx = state.products.findIndex(p=>p.sku===sku); if (idx===-1) return; const removed = state.products.splice(idx,1)[0];
  try { await gasDelete('Products', sku); showToast('已移除产品'); renderTab(); } catch(e) { state.products.splice(idx,0,removed); showToast('保存失败', true); }
}

  showToast('已下载 ✓ 正在同步到Drive…');

        <div class="summary-row"><div>应有现金</div><div class="val">${money(shift.expectedCash)}</div></div>
        <div class="summary-row"><div>实际点算</div><div class="val">${money(shift.actualCash)}</div></div>
        <div class="summary-row total"><div>差异</div><div class="val ${shift.variance!==0?'red-text':''}">${shift.variance>=0?'+':''}${money(shift.variance)}</div></div>
        <p class="hint" style="margin-top:8px">关班人:${esc(shift.closedByName)} · ${fmtDateTime(shift.closedAt)}</p>
      ` : `<p class="hint" style="margin-top:8px">班次仍在进行中,尚未关班。</p>`}
    </div>
    ${drawerEvents.length>0 ? `
      <div class="card">
        <h2 style="color:var(--danger)">⚠ 非交易开钱箱记录</h2>
        <div style="overflow-x:auto"><table><thead><tr><th>时间</th><th>员工</th></tr></thead><tbody>
          ${drawerEvents.map(e => `<tr class="flagged"><td>${fmtDateTime(e.timestamp)}</td><td>${esc(e.staffName)}</td></tr>`).join('')}
        </tbody></table></div>
      </div>` : ''}
    <div class="card">
      <h2>SiteGiant 关账匯出</h2>
      <p class="hint">按SKU汇总本班次销售数量,匯出成 isku / racks / batches / quantity_change 格式,可直接上传SiteGiant做库存扣减。</p>
      <button class="btn btn-primary" onclick="exportSiteGiant('${escAttr(shift.id)}')" ${salesInShift.length===0?'disabled':''}>匯出 SiteGiant Excel</button>
    </div>
  `;
}
async function exportSiteGiant(shiftId) {
  const salesInShift = state.sales.filter(s => s.shiftId === shiftId);
  if (salesInShift.length===0) return showToast('这个班次没有销售记录', true);
  const skuMap = {};
  for (const s of salesInShift) for (const it of s.items) { skuMap[it.sku] = (skuMap[it.sku]||0) + it.qty; }
  const rows = Object.keys(skuMap).map(sku => ({ isku: sku, quantity_change: -skuMap[sku] }));
  const ws = XLSX.utils.json_to_sheet(rows, { header:['isku','racks','batches','quantity_change'] });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'stock-adjustment');
  const filename = 'sitegiant_stock_adjustment_'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb, filename);
  showToast('已下载 ✓ 正在同步到Drive…');
  try {
    const base64 = XLSX.write(wb, { type:'base64', bookType:'xlsx' });
    await gasSaveFile(filename, base64, XLSX_MIME);
    showToast('已存进Google Drive ✓');
  } catch(e) { showToast('已下载,但存进Drive失败', true); }
}

// ============ SETTINGS ============
function renderSettings() {
  if (!state.settingsAuthStaff) {
    return `
      <div class="gate-wrap">
        <div class="gate-icon">🔒</div>
        <div class="gate-title">扫店长工卡才能进入设定</div>
        <div class="gate-sub">设定涉及店铺资料、积分规则、员工管理等敏感设置</div>
        <div class="card">
          <div class="field">${renderScanField('settingsAuth','扫描 barcode',true)}</div>
          ${state.settingsPasswordFallback ? `
            <div class="field" style="margin-top:12px">
              <label>管理密码(备用解锁方式)</label>
              <input id="settings-fallback-password" type="password" placeholder="输入管理密码" onkeydown="if(event.key==='Enter'){event.preventDefault(); submitSettingsPasswordFallback();}">
            </div>
            <button class="btn btn-primary btn-full" onclick="submitSettingsPasswordFallback()">用密码解锁</button>
          ` : `<p class="hint" style="margin-top:12px;text-align:center"><a style="cursor:pointer;color:var(--teal)" onclick="state.settingsPasswordFallback=true; renderTab();">没有店长工卡在身边?用管理密码解锁</a></p>`}
        </div>
      </div>`;
  }
  return `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div class="hint" style="margin:0">已由 <b style="color:var(--ink)">${esc(state.settingsAuthStaff.name)}</b> 授权进入</div>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="state.settingsAuthStaff=null; renderTab();">离开设定</button>
    </div>
    <div class="card">
      <h2>店铺资料(收据抬头)</h2>
      <div class="field"><label>店名</label><input id="s-shopname" value="${esc(state.config.shopName)}"></div>
      <div class="field"><label>地址(第1行)</label><input id="s-address1" value="${esc(state.config.addressLine1||'')}"></div>
      <div class="field"><label>地址(第2行)</label><input id="s-address2" value="${esc(state.config.addressLine2||'')}"></div>
      <div class="field"><label>地址(第3行,选填)</label><input id="s-address3" value="${esc(state.config.addressLine3||'')}"></div>
      <div class="row">
        <div class="field"><label>电话</label><input id="s-phone" value="${esc(state.config.phone)}"></div>
        <div class="field"><label>SST 登记号</label><input id="s-sst" value="${esc(state.config.sstNo)}"></div>
      </div>
      <div class="field"><label>收据纸张宽度</label>
        <select id="s-paperwidth"><option value="80" ${state.config.paperWidth==='80'?'selected':''}>80mm</option><option value="58" ${state.config.paperWidth==='58'?'selected':''}>58mm</option></select>
      </div>
      <button class="btn btn-primary" onclick="saveShopInfo()">保存店铺资料</button>
    </div>
    <div class="card">
      <h2>积分规则(默认费率,无等级会员/访客适用)</h2>
      <div class="row">
        <div class="field"><label>赚取比例(每消费 RM1 赚几分)</label><input id="s-earn" type="number" step="0.1" min="0" value="${state.config.pointsPerRM}"></div>
        <div class="field"><label>兑换比例(1 分 = 多少 RM)</label><input id="s-redeem" type="number" step="0.01" min="0" value="${state.config.pointValueRM}"></div>
      </div>
      <button class="btn btn-primary" onclick="savePointsRules()">保存积分规则</button>
    </div>
    <div class="card">
      <h2>会员等级</h2>
      <p class="hint">依累计终身消费自动升级,不会自动降级。等级排列由低到高,门檻金额越高的等级要排在越下面。</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>等级名称</th><th style="text-align:right">升级门檻(RM)</th><th style="text-align:right">赚取比例(pt/RM1)</th><th style="text-align:right">兑换比例(RM/pt)</th><th></th></tr></thead>
        <tbody>
          ${(state.config.tiers||[]).map((t,i) => `<tr>
            <td><input type="text" value="${esc(t.name)}" onchange="updateTierField(${i},'name',this.value)"></td>
            <td><input type="number" step="1" min="0" value="${t.threshold}" style="text-align:right" onchange="updateTierField(${i},'threshold',parseFloat(this.value)||0)"></td>
            <td><input type="number" step="0.1" min="0" value="${t.earnRate}" style="text-align:right" onchange="updateTierField(${i},'earnRate',parseFloat(this.value)||0)"></td>
            <td><input type="number" step="0.01" min="0" value="${t.redeemRate}" style="text-align:right" onchange="updateTierField(${i},'redeemRate',parseFloat(this.value)||0)"></td>
            <td><button class="btn-danger" onclick="removeTier(${i})">删除</button></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
      <button class="btn btn-ghost" style="margin-top:12px" onclick="addTier()">+ 新增等级</button>
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveTiers()">保存等级设定</button>
    </div>
    <div class="card">
      <h2>管理密码</h2>
      <p class="hint">清空会员这类不可逆操作,需要先输入这组密码才能执行。请设一个员工不容易猜到的密码。</p>
      <div class="field"><label>管理密码</label><input id="s-admin-password" type="password" value="${esc(state.config.adminPassword)}" placeholder="预设 0000,请尽快修改"></div>
      <button class="btn btn-primary" onclick="saveAdminPassword()">保存管理密码</button>
    </div>
    <div class="card">
      <h2>打印机诊断</h2>
      <p class="hint">检查这台装置有没有 iMin 原生打印 SDK,不需要开发者工具。</p>
      <button class="btn btn-ghost" onclick="checkIminSdkDiagnostic()">检查 iMin SDK</button>
      <div id="imin-diagnostic-result" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h2>员工 / 工卡</h2>
      <p class="hint">工卡编号是登入、结帐、开班/关班、开钱箱、编辑产品、查看佣金记录时扫描比对用的barcode。「店长」身份可以查看所有人的佣金记录,员工扫工卡只能看到自己的。</p>
      <div class="row3" style="align-items:end">
        <div class="field" style="margin-bottom:0"><label>姓名</label><input id="s-staff-name" placeholder="例如:Amy"></div>
        <div class="field" style="margin-bottom:0"><label>工卡编号 / Barcode</label><input id="s-staff-barcode" placeholder="例如:EMP001"></div>
        <div class="field" style="margin-bottom:0"><label>身份</label>
          <select id="s-staff-role">
            <option value="staff">员工</option>
            <option value="manager">店长</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:2px" onclick="addStaff()">新增员工</button>
      <div class="section-title">员工名单(${state.staff.length})</div>
      <div class="chip-list">${state.staff.map(s => `<div class="chip">${esc(s.name)} ${s.role==='manager'?'<span class="badge badge-gold" style="font-size:9px">店长</span>':''} <span style="color:var(--ink-soft);font-family:var(--mono);font-size:11px">(${esc(s.barcode)})</span><button onclick="removeStaff('${escAttr(s.id)}')">×</button></div>`).join('') || '<p class="hint">尚未新增员工</p>'}</div>
    </div>
  `;
}
function updateTierField(idx, field, value) {
  if (!state.config.tiers || !state.config.tiers[idx]) return;
  state.config.tiers[idx][field] = value;
}
function addTier() {
  state.config.tiers = state.config.tiers || [];
  state.config.tiers.push({ name:'New Tier', threshold:0, earnRate:1, redeemRate:0.1 });
  renderTab();
}
function removeTier(idx) {
  if (!state.config.tiers) return;
  state.config.tiers.splice(idx,1);
  renderTab();
}
async function saveTiers() {
  const prev = JSON.parse(JSON.stringify(state.config.tiers||[]));
  try { await saveConfig(); showToast('已保存会员等级设定 ✓'); renderTab(); }
  catch(e) { state.config.tiers = prev; showToast('保存失败', true); renderTab(); }
}
async function saveAdminPassword() {
  const pw = document.getElementById('s-admin-password').value.trim();
  if (!pw) return showToast('密码不能空白', true);
  const prev = state.config.adminPassword;
  state.config.adminPassword = pw;
  try { await saveConfig(); showToast('已更新管理密码 ✓'); } catch(e) { state.config.adminPassword = prev; showToast('保存失败', true); render(); }
}
async function saveShopInfo() {
  state.config.shopName = document.getElementById('s-shopname').value.trim() || 'Tinker Toddler';
  state.config.addressLine1 = document.getElementById('s-address1').value.trim();
  state.config.addressLine2 = document.getElementById('s-address2').value.trim();
  state.config.addressLine3 = document.getElementById('s-address3').value.trim();
  state.config.phone = document.getElementById('s-phone').value.trim();
  state.config.sstNo = document.getElementById('s-sst').value.trim();
  state.config.paperWidth = document.getElementById('s-paperwidth').value;
  try { await saveConfig(); showToast('已保存 ✓'); render(); } catch(e){ showToast('保存失败', true); }
}
async function savePointsRules() {
  const earn = parseFloat(document.getElementById('s-earn').value); const redeem = parseFloat(document.getElementById('s-redeem').value);
  if (isNaN(earn)||isNaN(redeem)||earn<0||redeem<0) return showToast('请输入有效数字', true);
  state.config.pointsPerRM = earn; state.config.pointValueRM = redeem;
  try { await saveConfig(); showToast('已保存积分规则 ✓'); renderTab(); } catch(e){ showToast('保存失败', true); }
}
async function addStaff() {
  const name = document.getElementById('s-staff-name').value.trim(); const barcode = document.getElementById('s-staff-barcode').value.trim();
  const role = document.getElementById('s-staff-role').value;
  if (!name||!barcode) return showToast('请填写姓名与工卡编号', true);
  if (state.staff.some(s=>s.barcode.toLowerCase()===barcode.toLowerCase())) return showToast('这个工卡编号已经存在', true);
  const staff = { id:'stf_'+Date.now(), name, barcode, role };
  state.staff.push(staff);
  try { await gasUpsert('Staff', staffToRow(staff)); showToast('已新增员工 ✓'); renderTab(); } catch(e) { state.staff.pop(); showToast('保存失败', true); }
}
async function removeStaff(id) {
  const idx = state.staff.findIndex(s=>s.id===id); if (idx===-1) return; const removed = state.staff.splice(idx,1)[0];
  try { await gasDelete('Staff', id); showToast('已移除员工'); renderTab(); } catch(e) { state.staff.splice(idx,0,removed); showToast('保存失败', true); }
}

loadAll();
</script>
