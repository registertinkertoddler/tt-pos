<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinker Toddler POS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2C4E47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TT POS">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- iMin 打印/钱箱 SDK:仅在 Falcon 等 iMin 设备的浏览器环境中才会真正提供 IminPrintInstance 物件,
     一般电脑/手机开启不影响其他功能,系统会自动侦测並退回标准打印。实际引入路径需在拿到设备後,
     依 iMin 当时提供的开发文件确认(可能是本机注入的物件,不一定需要外部 script 标签)。 -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --bg: #FAF7F2; --panel: #FFFFFF; --ink: #26302B; --ink-soft: #6B7570; --line: #E6E0D6;
    --teal: #3F6E64; --teal-deep: #2C4E47; --coral: #E1815F; --coral-soft: #FBEAE1;
    --amber: #C98A2B; --amber-soft: #FBF1DE; --danger: #C24A3F; --danger-soft: #FBEAE8;
    --gold: #B9922F; --gold-soft: #F7F0DC;
    --mono: 'JetBrains Mono', monospace; --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  #app { max-width: 1180px; margin: 0 auto; padding: 18px 16px 80px; }

  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .brand { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; color: var(--teal-deep); }
  .brand span { color: var(--coral); }
  .subline { font-size: 12px; color: var(--ink-soft); font-family: var(--mono); }
  .shift-pill { display:inline-flex; align-items:center; gap:6px; background:#EAF2EF; color:var(--teal-deep); padding:5px 12px; border-radius:100px; font-size:12px; font-weight:700; }
  .shift-pill.closed { background:#F4F1EA; color: var(--ink-soft); }
  .staff-pill { display:inline-flex; align-items:center; gap:8px; background: var(--gold-soft); color:#7A5F1F; padding:6px 14px; border-radius:100px; font-size:13px; font-weight:700; }
  .staff-pill button { border:none; background:#fff; color:#7A5F1F; width:20px; height:20px; border-radius:50%; cursor:pointer; font-size:12px; }

  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 18px; overflow-x: auto; }
  .tab-btn { flex: 1; min-width: 80px; padding: 10px 10px; border: none; background: transparent; border-radius: 9px; font-family: var(--sans); font-weight: 600; font-size: 13px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .tab-btn:hover { color: var(--teal-deep); }
  .tab-btn.active { background: var(--teal-deep); color: #fff; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; color: var(--teal-deep); }
  .card .hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 16px; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .field { margin-bottom: 14px; }
  input, select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; font-family: var(--sans); font-size: 14px; background: #fff; color: var(--ink); }
  input:focus, select:focus { outline: none; border-color: var(--teal); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .row4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .row, .row3, .row4 { grid-template-columns: 1fr; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 20px; border-radius: 9px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--teal-deep); color: #fff; }
  .btn-primary:hover { background: var(--teal); }
  .btn-ghost { background: var(--coral-soft); color: var(--coral); }
  .btn-gold { background: var(--gold-soft); color: var(--gold); }
  .btn-danger-solid { background: var(--danger); color:#fff; }
  .btn-danger { background: #fff; color: var(--danger); border: 1.5px solid #F1D4CF; padding: 6px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-full { width: 100%; }
  .btn-lg { padding: 16px; font-size: 16px; border-radius: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); border-bottom: 1.5px solid var(--line); font-weight: 700; white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.flagged td { background: var(--danger-soft); }
  tr:last-child td { border-bottom: none; }
  .sku-code { font-family: var(--mono); font-size: 12px; background: #F4F1EA; padding: 2px 6px; border-radius: 5px; }
  .num { font-family: var(--mono); font-weight: 700; text-align: right; }
  .red-text { color: var(--danger); font-weight:700; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .badge-promo { background: var(--coral-soft); color: var(--coral); }
  .badge-gold { background: var(--gold-soft); color: var(--gold); }
  .badge-danger { background: var(--danger-soft); color: var(--danger); }
  .badge-teal { background:#EAF2EF; color:var(--teal-deep); }
  .badge-tier-base { background:#F4F1EA; color:var(--ink-soft); }
  .badge-tier-silver { background:#E9ECEF; color:#5A6472; }
  .badge-tier-gold { background:var(--gold-soft); color:var(--gold); }
  .badge-tier-platinum { background:#EDE7F6; color:#6A4FA3; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar select, .toolbar input { width: auto; min-width: 130px; flex: 1; }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .empty .big { font-size: 32px; margin-bottom: 8px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--teal-deep); color: #fff; padding: 12px 22px; border-radius: 100px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: all .25s ease; pointer-events: none; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  .loading-wrap { display: flex; align-items: center; justify-content: center; padding: 60px 0; color: var(--ink-soft); font-size: 13px; }
  .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--teal); animation: spin .7s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: flex; align-items: center; gap: 8px; background: #F4F1EA; border-radius: 100px; padding: 6px 8px 6px 14px; font-size: 13px; font-weight: 600; }
  .chip button { border: none; background: #fff; color: var(--ink-soft); width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 13px; }
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin: 22px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  /* Gate screens (open shift / login) */
  .gate-wrap { max-width: 420px; margin: 40px auto; }
  .gate-icon { font-size: 40px; text-align: center; margin-bottom: 6px; }
  .gate-title { font-size: 19px; font-weight: 800; text-align: center; color: var(--teal-deep); margin-bottom: 4px; }
  .gate-sub { font-size: 13px; text-align: center; color: var(--ink-soft); margin-bottom: 22px; }
  .scan-input-lg { font-family: var(--mono); font-size: 17px; padding: 15px 14px; border: 2px solid var(--teal); border-radius: 10px; text-align:center; }
  .scan-input-wrap { display: flex; gap: 8px; flex: 1; }
  .scan-input-wrap input { flex: 1; }
  .scan-display { flex: 1; font-family: var(--mono); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; display: flex; align-items: center; min-height: 20px; word-break: break-all; }
  .scan-display.scan-input-lg { font-size: 17px; padding: 15px 14px; border: 2px solid var(--teal); border-radius: 10px; justify-content: center; text-align: center; }
  .scan-placeholder { color: var(--ink-soft); }
  .kb-btn { flex-shrink: 0; width: 48px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; font-size: 18px; cursor: pointer; }
  .kb-btn:hover { background: #F4F1EA; }
  .gate-links { display:flex; justify-content:center; gap: 18px; margin-top:18px; font-size: 12.5px; }
  .gate-links a { color: var(--ink-soft); text-decoration: underline; cursor:pointer; }

  /* POS layout */
  .pos-stack { display: flex; flex-direction: column; gap: 16px; }
  .pos-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 620px) { .pos-grid { grid-template-columns: 1fr; } }
  .scan-box { display: flex; gap: 8px; margin-bottom: 10px; }
  .scan-box input { font-family: var(--mono); font-size: 16px; padding: 14px 14px; border: 2px solid var(--teal); border-radius: 10px; }
  .scan-hint { font-size: 12px; color: var(--ink-soft); margin: -4px 0 14px; }
  .cart-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cart-row:last-child { border-bottom: none; }
  .cart-item-name { font-weight: 700; font-size: 14px; }
  .cart-item-sub { font-size: 11.5px; color: var(--ink-soft); font-family: var(--mono); }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qty-btn { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-weight: 700; color: var(--teal-deep); }
  .qty-val { min-width: 20px; text-align: center; font-family: var(--mono); font-weight: 700; }
  .price-strike { text-decoration: line-through; color: var(--ink-soft); font-size: 11.5px; }
  .member-selected { background: var(--gold-soft); border: 1.5px solid var(--gold); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .member-selected .name { font-weight: 800; color: #7A5F1F; }
  .member-selected .pts { font-family: var(--mono); font-size: 12.5px; color: #7A5F1F; }
  .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .summary-row.total { font-size: 20px; font-weight: 800; border-top: 1.5px solid var(--line); margin-top: 8px; padding-top: 12px; color: var(--teal-deep); }
  .summary-row .val { font-family: var(--mono); font-weight: 700; }
  .pay-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0; }
  .pay-opt { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 6px; text-align: center; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
  .pay-opt.active { border-color: var(--teal); background: #EEF4F2; color: var(--teal-deep); }
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; margin-top: 4px; }
  .quick-card { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; background: #fff; }
  .quick-card:hover { border-color: var(--teal); }
  .quick-card .qn { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; }
  .quick-card .qs { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .quick-card .qp { font-family: var(--mono); font-weight: 800; color: var(--teal-deep); margin-top: 4px; }

  /* Receipt / print */
  #receipt-print { display: none; }
  .receipt-paper { width: 260px; box-sizing: border-box; margin: 0 auto; font-family: var(--mono); font-size: 12px; color: #000; padding: 6px 4px; background: #fff; }
  .receipt-paper.w58 { width: 185px; font-size: 9.5px; padding: 5px 3px; }
  .receipt-paper .rc-title { text-align: center; font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .receipt-paper.w58 .rc-title { font-size: 13px; }
  .receipt-paper .rc-sub { text-align: center; font-size: 10px; margin-bottom: 6px; }
  .receipt-paper hr { border: none; border-top: 1px dashed #000; margin: 8px 0; }
  .receipt-paper .rc-line { display: flex; justify-content: space-between; gap: 6px; margin: 3px 0; }
  .receipt-paper .rc-line > div:last-child { text-align: right; flex-shrink: 0; }
  .receipt-paper .rc-line > div:first-child { overflow-wrap: break-word; min-width: 0; }
  .receipt-paper .rc-item-name { font-weight: 700; }
  .receipt-paper .rc-total { font-weight: 700; font-size: 14px; }
  .receipt-paper .rc-foot { text-align: center; margin-top: 12px; font-size: 10px; }
  @media print {
    body * { visibility: hidden; }
    #receipt-print, #receipt-print * { visibility: visible; }
    #receipt-print { display: block; position: fixed; top: 0; left: 0; width: 100%; }
  }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(38,48,43,0.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .modal { background: #fff; border-radius: 16px; padding: 24px; max-width: 380px; width: 100%; max-height: 85vh; overflow-y: auto; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 700px) { .stat-row { grid-template-columns: repeat(2,1fr); } }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .num { font-family: var(--mono); font-size: 19px; font-weight: 700; color: var(--teal-deep); }
  .stat .label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }
</style>
</head>
<body>
<div id="app"><div class="loading-wrap"><div class="spinner"></div>正在加载 POS 系统…</div></div>
<div id="receipt-print"></div>
<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxB27SdQrtB_muQB8XSnX2l8SC_BGpf5Bs1-IrEbRmrXY49kwpG28T_qN1trq_d2JcQ/exec';

let state = {
  loaded: false, tab: 'pos', posView: 'checkLoading',
  config: { shopName:'Tinker Toddler', address:'', phone:'', sstNo:'', pointsPerRM:0.01, pointValueRM:0.333333, paperWidth:'80', adminPassword:'8689',
    tiers: [
      { name:'Member', threshold:0, earnRate:0.01, redeemRate:0.333333 },
      { name:'Silver Member', threshold:300, earnRate:0.01, redeemRate:0.5 },
      { name:'Gold Member', threshold:5000, earnRate:0.01, redeemRate:1 },
      { name:'Platinum Member', threshold:10000, earnRate:0.01, redeemRate:1 },
    ]
  },
  staff: [], products: [], members: [], sales: [], shifts: [], drawerEvents: [],
  currentStaff: null, cart: [], selectedMember: null, redeemPoints: 0, payMethod: 'Cash', paymentLines: [], checkoutSubmitting: false,
  manualDiscount: { type: 'amount', value: 0, note: '' },
  itemDiscountModalSku: null, discountModalOpen: false,
  memberSearch: '', idleTimer: null,
  loginScanVal: '', drawerModalOpen: false, closeShiftModalOpen: false, openShiftModalOpen: false,
  scanBuffers: { product:'', gate:'', login:'', drawer:'', close:'', editAuth:'', commissionAuth:'', returnAuth:'', settingsAuth:'' }, activeScanContext: null, manualEntryContext: null,
  editAuthOpen: false, pendingEditSku: null, editingStaff: null, editAuthAction: null, editAuthRequireManager: false,
  commissionAuthStaff: null,
  settingsAuthStaff: null, settingsPasswordFallback: false,
  returnAuthOpen: false, pendingReturnSaleId: null, returnStaff: null,
  returnModalOpen: false, returnItems: [], returnNewCart: [], returnPayMethod: 'Cash', returnPaymentLines: [], returnSubmitting: false,
  orderDetailSaleId: null,
  memberDetailId: null, memberEditMode: false,
  dangerAction: null, dangerPasswordInput: '',
  editingSku: null,
  recordsSubTab: 'sales', recFilterStaff: '', recFilterDate: '', recSearchQuery: '',
  shiftDetailId: null,
};

function showToast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { el.className = 'toast'; }, 2300);
}
function money(n) { return 'RM' + (Math.round((n + Number.EPSILON) * 100) / 100).toFixed(2); }
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function escAttr(s) { return String(s).replace(/'/g, "\\'"); }
function fmtDateTime(ts) { const d = new Date(ts); return d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}) + ' ' + d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTimeWithYear(ts) { const d = new Date(ts); return d.toLocaleDateString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit'}) + ' ' + d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }

// ============ Google Apps Script 储存层 ============
async function gasList(sheet) {
  const res = await fetch(`${GAS_URL}?sheet=${sheet}&action=list`);
  const data = await res.json();
  return data.rows || [];
}
async function gasUpsert(sheet, row) {
  const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'upsert', sheet, row }) });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'upsert failed');
}
async function gasBulkUpsert(sheet, rows) {
  if (!rows || rows.length===0) return;
  const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'bulkUpsert', sheet, rows }) });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'bulkUpsert failed');
}
async function gasDelete(sheet, id) {
  const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'delete', sheet, id }) });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'delete failed');
}
async function gasClearSheet(sheet) {
  const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'clearSheet', sheet }) });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'clearSheet failed');
}
async function gasSaveFile(filename, base64, mimeType) {
  const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'saveFile', filename, base64, mimeType }) });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'saveFile failed');
  return data;
}
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

// ---- row <-> state 物件 转换 ----
function toBool(v) { return v === true || v === 'TRUE' || v === 'true'; }
function numOr(v, def) { const n = parseFloat(v); return isNaN(n) ? def : n; }

function parseProductRow(r) {
  return {
    sku: String(r.sku), brand: r.brand || '', name: r.name || '',
    price: numOr(r.price, 0), promoPrice: (r.promoPrice===''||r.promoPrice==null) ? null : numOr(r.promoPrice, null),
    promoActive: toBool(r.promoActive), commission: numOr(r.commission, 0), commissionType: r.commissionType || 'fixed',
    barcodes: r.barcodes ? (() => { try { return JSON.parse(r.barcodes); } catch(e){ return []; } })() : [],
    editedBy: r.editedBy || '', editedAt: r.editedAt || '',
  };
}
function productToRow(p) {
  return { sku:p.sku, brand:p.brand||'', name:p.name, price:p.price, promoPrice:p.promoPrice==null?'':p.promoPrice, promoActive: !!p.promoActive, commission: p.commission||0, commissionType: p.commissionType||'fixed', barcodes: JSON.stringify(p.barcodes||[]), editedBy: p.editedBy||'', editedAt: p.editedAt||'' };
}
function parseMemberRow(r) { return { id:String(r.id), name:r.name||'', phone:String(r.phone||''), points: numOr(r.points,0), joinDate: r.joinDate||new Date().toISOString(), tier: r.tier || 'Member', totalSpend: numOr(r.totalSpend,0), storeCredit: numOr(r.storeCredit,0) }; }
function memberToRow(m) { return { id:m.id, name:m.name, phone:m.phone, points:m.points, joinDate:m.joinDate, tier: m.tier||'Member', totalSpend: m.totalSpend||0, storeCredit: m.storeCredit||0 }; }
function parseStaffRow(r) { return { id:String(r.id), name:r.name||'', barcode:String(r.barcode||''), role: r.role||'staff' }; }
function staffToRow(s) { return { id:s.id, name:s.name, barcode:s.barcode, role:s.role||'staff' }; }
function parseSaleRow(r) {
  let items = []; try { items = JSON.parse(r.itemsJson||'[]'); } catch(e) {}
  let payments = []; try { payments = r.paymentsJson ? JSON.parse(r.paymentsJson) : []; } catch(e) {}
  if (payments.length===0 && r.payMethod) payments = [{ method: r.payMethod, amount: numOr(r.total,0) }]; // 向下相容旧资料
  return {
    id:String(r.id), timestamp:r.timestamp, shiftId:String(r.shiftId||''), cashier:r.cashier||'', cashierId:String(r.cashierId||''),
    commissionStaff:r.commissionStaff||'', commissionStaffId:String(r.commissionStaffId||''), commissionTotal:numOr(r.commissionTotal,0),
    items, subtotal:numOr(r.subtotal,0), discount:numOr(r.discount,0), cashRoundingAdj:numOr(r.cashRoundingAdj,0), total:numOr(r.total,0),
    payMethod:r.payMethod||(payments[0]?payments[0].method:'Cash'), payments,
    cashTendered: (r.cashTendered===''||r.cashTendered==null)?null:numOr(r.cashTendered,null),
    changeGiven: (r.changeGiven===''||r.changeGiven==null)?null:numOr(r.changeGiven,null),
    memberId: r.memberId?String(r.memberId):null, memberName: r.memberName||null, pointsEarned:numOr(r.pointsEarned,0), pointsRedeemed:numOr(r.pointsRedeemed,0),
    type: r.type || 'sale', refSaleId: r.refSaleId || null, processedBy: r.processedBy || '',
    transactionNumber: r.transactionNumber || String(r.id).slice(-8).toUpperCase(), // 旧资料没有编号时,退而求其次用id尾端顶替,避免空白
    manualDiscountAmount: numOr(r.manualDiscountAmount,0), manualDiscountType: r.manualDiscountType || 'amount', manualDiscountNote: r.manualDiscountNote || '',
    manualDiscountValue: numOr(r.manualDiscountValue,0),
  };
}
function saleToRow(s) {
  return { id:s.id, timestamp:s.timestamp, shiftId:s.shiftId, cashier:s.cashier, cashierId:s.cashierId, commissionStaff:s.commissionStaff, commissionStaffId:s.commissionStaffId,
    commissionTotal:s.commissionTotal, itemsJson: JSON.stringify(s.items), subtotal:s.subtotal, discount:s.discount, cashRoundingAdj:s.cashRoundingAdj, total:s.total,
    payMethod:s.payMethod, paymentsJson: JSON.stringify(s.payments||[]), cashTendered: s.cashTendered==null?'':s.cashTendered, changeGiven: s.changeGiven==null?'':s.changeGiven,
    memberId: s.memberId||'', memberName: s.memberName||'', pointsEarned:s.pointsEarned, pointsRedeemed:s.pointsRedeemed,
    type: s.type||'sale', refSaleId: s.refSaleId||'', processedBy: s.processedBy||'', transactionNumber: s.transactionNumber||'',
    manualDiscountAmount: s.manualDiscountAmount||0, manualDiscountType: s.manualDiscountType||'amount', manualDiscountNote: s.manualDiscountNote||'',
    manualDiscountValue: s.manualDiscountValue||0 };
}
function generateTransactionNumber(type) {
  // 前缀标示类型:IN(销售)/ER(换货)/RR(退货),後面6码英数字亂碼,不含容易混淆的 0/O、1/I/L,
  // 跟日期/順序完全無關,看不出是第幾筆交易
  const prefix = type === 'exchange' ? 'ER' : type === 'return' ? 'RR' : 'IN';
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return prefix + s;
}
function parseShiftRow(r) {
  let totals; try { totals = r.totalsJson ? JSON.parse(r.totalsJson) : undefined; } catch(e) {}
  return { id:String(r.id), openedBy:String(r.openedBy||''), openedByName:r.openedByName||'', openedAt:r.openedAt, startingCash:numOr(r.startingCash,0),
    status:r.status||'open', closedBy: r.closedBy?String(r.closedBy):undefined, closedByName:r.closedByName||undefined, closedAt:r.closedAt||undefined,
    actualCash: r.actualCash===''?undefined:numOr(r.actualCash,undefined), expectedCash: r.expectedCash===''?undefined:numOr(r.expectedCash,undefined),
    variance: r.variance===''?undefined:numOr(r.variance,undefined), totals };
}
function shiftToRow(s) {
  return { id:s.id, openedBy:s.openedBy, openedByName:s.openedByName, openedAt:s.openedAt, startingCash:s.startingCash, status:s.status,
    closedBy: s.closedBy||'', closedByName: s.closedByName||'', closedAt: s.closedAt||'', actualCash: s.actualCash==null?'':s.actualCash,
    expectedCash: s.expectedCash==null?'':s.expectedCash, variance: s.variance==null?'':s.variance, totalsJson: s.totals?JSON.stringify(s.totals):'' };
}
function parseDrawerRow(r) { return { id:String(r.id), timestamp:r.timestamp, staffId:String(r.staffId||''), staffName:r.staffName||'', shiftId:String(r.shiftId||'') }; }
function drawerToRow(e) { return { id:e.id, timestamp:e.timestamp, staffId:e.staffId, staffName:e.staffName, shiftId:e.shiftId||'' }; }

async function loadAll() {
  try {
    const [configRows, staffRows, productRows, memberRows, saleRows, shiftRows, drawerRows] = await Promise.all([
      gasList('Config'), gasList('Staff'), gasList('Products'), gasList('Members'), gasList('Sales'), gasList('Shifts'), gasList('DrawerEvents'),
    ]);
    const cfg = { ...state.config };
    for (const r of configRows) {
      const v = r.value;
      if (r.key === 'tiers') {
        try { const parsed = JSON.parse(v); if (Array.isArray(parsed) && parsed.length>0) cfg.tiers = parsed; } catch(e) {}
        continue;
      }
      cfg[r.key] = (v==='true'||v===true) ? true : (v==='false'||v===false) ? false : (!isNaN(parseFloat(v)) && v!=='' && ['pointsPerRM','pointValueRM'].includes(r.key)) ? parseFloat(v) : v;
    }
    state.config = cfg;
    state.staff = staffRows.map(parseStaffRow);
    state.products = productRows.map(parseProductRow);
    state.members = memberRows.map(parseMemberRow);
    state.sales = saleRows.map(parseSaleRow);
    state.shifts = shiftRows.map(parseShiftRow);
    state.drawerEvents = drawerRows.map(parseDrawerRow);
    state.loaded = true;
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="empty"><div class="big">⚠️</div>加载失败,请检查网路连线或重新整理。<br><span style="font-size:11px;color:var(--ink-soft)">'+esc(e.message||'')+'</span></div>';
  }
}
async function saveConfig() {
  const rows = Object.keys(state.config).map(key => ({ key, value: state.config[key] }));
  await gasBulkUpsert('Config', rows);
}


function findStaffByBarcode(code) {
  const c = (code||'').trim().toLowerCase();
  if (!c) return null;
  return state.staff.find(s => s.barcode.toLowerCase() === c) || null;
}
function getOpenShift() { return state.shifts.find(s => s.status === 'open') || null; }

// ============ 全域扫码缓冲(避免虚拟键盘跳出挡住画面) ============
// 原理:不把光标聚焦在真的输入框上,而是在背景监听键盘事件(扫码枪本质是模拟键盘快速打字+Enter),
// 因为没有任何输入框被"选中",Android不会跳出虚拟键盘。手动打字时才切换成真的输入框。
const LIVE_SEARCH_CONTEXTS = { memberSearch: 'memberListSearch', productSearch: 'productSearch', salesSearch: 'recSearchQuery' };
document.addEventListener('keydown', function(e) {
  const ctx = state.activeScanContext;
  if (!ctx) return;
  if (state.manualEntryContext === ctx) return; // 手动模式下交给真正的输入框自己处理
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.id && !ae.id.startsWith('manual-')) {
    return; // 使用者正在别的正常欄位打字(例如新增会员表单),不要抢走按键
  }
  // 搜寻类情境:每个按键即时反映到搜寻结果,不用等Enter(掃碼槍掃完也會自動即時套用,不影響掃碼使用)
  if (LIVE_SEARCH_CONTEXTS[ctx]) {
    const key = LIVE_SEARCH_CONTEXTS[ctx];
    if (e.key === 'Enter') { e.preventDefault(); return; }
    if (e.key === 'Backspace') { state[key] = (state[key]||'').slice(0,-1); }
    else if (e.key.length === 1) { state[key] = (state[key]||'') + e.key; }
    else { return; }
    renderTab();
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = state.scanBuffers[ctx] || '';
    state.scanBuffers[ctx] = '';
    const disp = document.getElementById('scan-display-'+ctx);
    if (disp) disp.innerHTML = '<span class="scan-placeholder">等待扫描…</span>';
    handleScanSubmit(ctx, val);
    return;
  }
  if (e.key === 'Backspace') {
    state.scanBuffers[ctx] = (state.scanBuffers[ctx]||'').slice(0,-1);
  } else if (e.key.length === 1) {
    state.scanBuffers[ctx] = (state.scanBuffers[ctx]||'') + e.key;
  } else {
    return;
  }
  const disp = document.getElementById('scan-display-'+ctx);
  if (disp) disp.textContent = STAFF_BARCODE_CONTEXTS.includes(ctx) ? '•'.repeat((state.scanBuffers[ctx]||'').length) : (state.scanBuffers[ctx] || '');
});

function handleScanSubmit(ctx, val) {
  if (ctx === 'product') { handleScan(val); return; }
  if (ctx === 'gate') { submitOpenShiftStaff(val); return; }
  if (ctx === 'login') { submitLogin(val); return; }
  if (ctx === 'drawer') { submitDrawerOpen(val); return; }
  if (ctx === 'close') { const s = getOpenShift(); submitCloseShift(s ? s.id : null, val); return; }
  if (ctx === 'editAuth') { submitEditAuth(val); return; }
  if (ctx === 'returnAuth') { submitReturnAuth(val); return; }
  if (ctx === 'commissionAuth') { submitCommissionAuth(val); return; }
  if (ctx === 'settingsAuth') { submitSettingsAuth(val); return; }
}

const STAFF_BARCODE_CONTEXTS = ['login','gate','editAuth','returnAuth','settingsAuth','commissionAuth','drawer','close'];
function renderScanField(context, placeholder, large) {
  const isManual = state.manualEntryContext === context;
  const buffer = state.scanBuffers[context] || '';
  const cls = large ? 'scan-input-lg' : '';
  const masked = STAFF_BARCODE_CONTEXTS.includes(context);
  if (isManual) {
    return `<div class="scan-input-wrap">
      <input id="manual-${context}" class="${cls}" type="${masked?'password':'text'}" placeholder="${esc(placeholder||'')}" autocomplete="off" value="${esc(buffer)}"
        oninput="state.scanBuffers['${context}']=this.value"
        onkeydown="if(event.key==='Enter'){event.preventDefault(); finishManualEntry('${context}');}">
      <button type="button" class="kb-btn" onclick="finishManualEntry('${context}')">✓</button>
    </div>`;
  }
  const displayContent = buffer ? (masked ? '•'.repeat(buffer.length) : esc(buffer)) : `<span class="scan-placeholder">${esc(placeholder||'等待扫描…')}</span>`;
  return `<div class="scan-input-wrap">
    <div class="scan-display ${cls}" id="scan-display-${context}">${displayContent}</div>
    <button type="button" class="kb-btn" onclick="enableManualEntry('${context}')">⌨️</button>
  </div>`;
}
function enableManualEntry(context) { state.manualEntryContext = context; renderTab(); }
function renderLiveSearchField(context, stateKey, placeholder) {
  const isManual = state.manualEntryContext === context;
  const value = state[stateKey] || '';
  if (isManual) {
    return `<div class="scan-input-wrap">
      <input id="manual-${context}" placeholder="${esc(placeholder||'')}" autocomplete="off" value="${esc(value)}"
        oninput="state['${stateKey}']=this.value; renderTab(); setTimeout(()=>{ const i=document.getElementById('manual-${context}'); if(i){ i.focus(); i.selectionStart=i.selectionEnd=i.value.length; } },0);"
        onkeydown="if(event.key==='Enter'){event.preventDefault(); state.manualEntryContext=null; renderTab();}">
      <button type="button" class="kb-btn" onclick="state.manualEntryContext=null; renderTab();">✓</button>
    </div>`;
  }
  return `<div class="scan-input-wrap">
    <div class="scan-display" id="scan-display-${context}">${value ? esc(value) : `<span class="scan-placeholder">${esc(placeholder||'')}</span>`}</div>
    <button type="button" class="kb-btn" onclick="enableManualEntry('${context}')">⌨️</button>
  </div>`;
}
function finishManualEntry(context) {
  const val = state.scanBuffers[context] || '';
  state.manualEntryContext = null; state.scanBuffers[context] = '';
  handleScanSubmit(context, val);
}

// ============ 危险操作密码确认(通用) ============
function requireAdminPassword(actionKey, label) {
  state.dangerAction = actionKey; state.dangerActionLabel = label; state.dangerPasswordInput = '';
  renderTab();
  setTimeout(() => { const i = document.getElementById('danger-password-input'); if (i) i.focus(); }, 0);
}
function cancelDangerAction() { state.dangerAction = null; state.dangerPasswordInput = ''; renderTab(); }
function renderDangerModal() {
  if (!state.dangerAction) return '';
  return `<div class="modal-backdrop" onclick="if(event.target===this) cancelDangerAction()">
    <div class="modal">
      <h2 style="margin-top:0;color:var(--danger)">⚠️ ${esc(state.dangerActionLabel)}</h2>
      <p class="hint">这是不可逆的操作,请输入管理密码确认。</p>
      <div class="field">
        <input id="danger-password-input" type="password" placeholder="管理密码" value="${esc(state.dangerPasswordInput)}"
          oninput="state.dangerPasswordInput=this.value"
          onkeydown="if(event.key==='Enter'){event.preventDefault(); confirmDangerAction();}">
      </div>
      <button class="btn btn-danger-solid btn-full" onclick="confirmDangerAction()">确认执行</button>
      <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="cancelDangerAction()">取消</button>
    </div>
  </div>`;
}
async function confirmDangerAction() {
  const input = document.getElementById('danger-password-input');
  const pw = input ? input.value : state.dangerPasswordInput;
  if (pw !== state.config.adminPassword) { showToast('密码不正确', true); return; }
  const action = state.dangerAction;
  state.dangerAction = null; state.dangerPasswordInput = '';
  if (action === 'clearMembers') await doClearAllMembers();
  else if (action === 'clearSales') await doClearAllSales();
  else if (action === 'clearProducts') await doClearAllProducts();
  else renderTab();
}
function clearAllSales() { requireAdminPassword('clearSales', '清空所有销售记录'); }
async function doClearAllSales() {
  const backup = state.sales;
  state.sales = [];

  try { await gasClearSheet('Sales'); showToast('已清空所有销售记录 ✓'); }

function resetIdleTimer() {
  if (state.idleTimer) clearTimeout(state.idleTimer);
  if (state.currentStaff) {
    state.idleTimer = setTimeout(() => {
      state.currentStaff = null; state.cart = []; state.selectedMember = null; state.redeemPoints = 0;
      showToast('闲置超时,已自动登出');
      render();
    }, 5*60*1000);
  }
}

function render() {
  const app = document.getElementById('app');
  if (!state.loaded) { app.innerHTML = '<div class="loading-wrap"><div class="spinner"></div>正在加载 POS 系统…</div>'; return; }
  const openShift = getOpenShift();
  app.innerHTML = `
    <div class="header">
      <div>
        <div class="brand">${esc(state.config.shopName)} <span>POS</span></div>
        <div class="subline">${openShift ? `<span class="shift-pill">● 班次进行中 · 开班於 ${fmtDateTime(openShift.openedAt)}</span>` : `<span class="shift-pill closed">○ 尚未开班</span>`}</div>
      </div>
      ${state.currentStaff ? `<div class="staff-pill">👤 ${esc(state.currentStaff.name)}<button onclick="manualLogout()">×</button></div>` : ''}
    </div>
    <div class="tabs">
      ${tabBtn('pos','收银')}
      ${tabBtn('members','会员')}
      ${tabBtn('products','产品')}
      ${tabBtn('records','记录')}
      ${tabBtn('shifts','班次')}
      ${tabBtn('settings','设定')}
    </div>
    <div id="tab-content"></div>
  `;
  renderTab();
}
function tabBtn(key,label){ return `<button class="tab-btn ${state.tab===key?'active':''}" onclick="setTab('${key}')">${label}</button>`; }
function setTab(key){
  if (state.tab==='records' && key!=='records') state.commissionAuthStaff = null;
  if (state.tab==='settings' && key!=='settings') { state.settingsAuthStaff = null; state.settingsPasswordFallback = false; }
  state.tab = key; render();
}
function computeActiveScanContext() {
  if (state.editAuthOpen) return 'editAuth';
  if (state.returnAuthOpen) return 'returnAuth';
  if (state.tab === 'records' && state.recordsSubTab === 'commission' && !state.commissionAuthStaff) return 'commissionAuth';
  if (state.tab === 'records' && state.recordsSubTab === 'sales') return 'salesSearch';
  if (state.tab === 'settings' && !state.settingsAuthStaff) return 'settingsAuth';
  if (state.tab === 'members') return 'memberSearch';
  if (state.tab === 'products') return 'productSearch';
  if (state.tab !== 'pos') return null;
  if (state.closeShiftModalOpen) return 'close';
  if (state.drawerModalOpen) return 'drawer';
  const openShift = getOpenShift();
  if (!openShift) return 'gate';
  if (!state.currentStaff) return 'login';
  return 'product';
}
function renderTab() {
  state.activeScanContext = computeActiveScanContext();
  const el = document.getElementById('tab-content');
  if (state.tab === 'pos') el.innerHTML = renderPos();
  if (state.tab === 'members') el.innerHTML = renderMembers();
  if (state.tab === 'products') el.innerHTML = renderProducts();
  if (state.tab === 'records') el.innerHTML = renderRecords();
  if (state.tab === 'shifts') el.innerHTML = renderShifts();
  if (state.tab === 'settings') el.innerHTML = renderSettings();
  afterRender();
}
function afterRender() {
  if (state.tab === 'pos') {
    const openShift = getOpenShift();
    if (openShift && state.currentStaff) {
      const memberSearchInput = document.getElementById('member-search-input');
      if (memberSearchInput) {
        memberSearchInput.oninput = () => {
          state.memberSearch = memberSearchInput.value;
          renderTab();
          const m = document.getElementById('member-search-input');
          if (m) { m.focus(); m.selectionStart = m.selectionEnd = m.value.length; }
        };
      }
      resetIdleTimer();
      document.getElementById('tab-content').onclick = resetIdleTimer;
    }
    // 若目前情境有开启手动输入模式,自动聚焦该欄位跳出键盘
    if (state.manualEntryContext) {
      const mi = document.getElementById('manual-'+state.manualEntryContext);
      if (mi) { mi.focus(); mi.selectionStart = mi.selectionEnd = mi.value.length; }
    }
  }
  if (state.tab === 'records') {
    const s = document.getElementById('rec-staff-filter'); if (s) s.onchange = () => { state.recFilterStaff = s.value; renderTab(); };
    const d = document.getElementById('rec-date-filter'); if (d) d.onchange = () => { state.recFilterDate = d.value; renderTab(); };
  }
}

// ============ POS STATE MACHINE ============
function renderPos() {
  const openShift = getOpenShift();
  if (!openShift) return renderOpenShiftGate();
  if (!state.currentStaff) return renderLoginGate(openShift);
  return renderCheckout(openShift);
}

// ---- Open Shift Gate ----
function renderOpenShiftGate() {
  if (state.staff.length === 0) return `<div class="card"><div class="empty"><div class="big">👥</div>还没有登记任何员工。<br>先到「设定」分頁新增员工与工卡barcode。</div></div>`;
  return `
    <div class="gate-wrap">
      <div class="gate-icon">🌅</div>
      <div class="gate-title">开班 Open Shift</div>
      <div class="gate-sub">扫描员工工卡开始今天的班次</div>
      <div class="card">
        <div class="field"><label>扫描 / 输入工卡编号</label>${renderScanField('gate','扫描 barcode',true)}</div>
        <div class="field"><label>起始现金 (RM)</label><input id="gate-cash" type="number" step="0.01" min="0" placeholder="例如 200.00"></div>
        <button class="btn btn-primary btn-full btn-lg" onclick="submitOpenShiftStaff(state.scanBuffers.gate)">开班</button>
      </div>
    </div>
  `;
}
async function submitOpenShiftStaff(barcode) {
  const cashVal = parseFloat(document.getElementById('gate-cash').value);
  const staff = findStaffByBarcode(barcode);
  if (!staff) return showToast('找不到这个工卡编号', true);
  if (isNaN(cashVal) || cashVal < 0) return showToast('请输入有效的起始现金', true);
  const shift = { id: 'shift_'+Date.now(), openedBy: staff.id, openedByName: staff.name, openedAt: new Date().toISOString(), startingCash: cashVal, status: 'open' };
  state.shifts.push(shift);
  state.scanBuffers.gate = '';
  try { await gasUpsert('Shifts', shiftToRow(shift)); showToast('已开班 ✓ '+staff.name); renderTab(); render(); }
  catch(e) { state.shifts.pop(); showToast('保存失败', true); }
}

// ---- Login Gate ----
function renderLoginGate(openShift) {
  return `
    <div class="gate-wrap">
      <div class="gate-icon">🔑</div>
      <div class="gate-title">员工登入</div>
      <div class="gate-sub">扫描工卡开始这一笔交易</div>
      <div class="card">
        <div class="field">${renderScanField('login','扫描 barcode',true)}</div>
        <button class="btn btn-primary btn-full btn-lg" onclick="submitLogin(state.scanBuffers.login)">登入</button>
      </div>
      <div class="gate-links">
        <a onclick="openDrawerModal()">🔓 开钱箱</a>
        <a onclick="openCloseShiftModal()">🌙 关班 Close Shift</a>
      </div>
      ${renderDrawerModal()}
      ${renderCloseShiftModal(openShift)}
    </div>
  `;
}
function submitLogin(barcode) {
  const staff = findStaffByBarcode(barcode);
  if (!staff) return showToast('找不到这个工卡编号', true);
  state.scanBuffers.login = '';
  state.currentStaff = staff; state.cart = []; state.selectedMember = null; state.redeemPoints = 0; state.payMethod = 'Cash'; state.cashTendered = null; state.paymentLines = []; state.manualDiscount = { type:'amount', value:0, note:'' }; state.itemDiscountModalSku = null; state.discountModalOpen = false;
  render();
}
function manualLogout() {
  state.currentStaff = null; state.cart = []; state.selectedMember = null; state.redeemPoints = 0;
  if (state.idleTimer) clearTimeout(state.idleTimer);
  render();
}

// ---- Drawer modal (non-transaction open) ----
function neutralizeFocus() {
  setTimeout(() => {
    const ae = document.activeElement;

// ============ iMin SDK integration (Falcon) ============
// 侦测设备上是否有 iMin 打印SDK (IminPrintInstance)。有 Falcon 打印插件/H5打印环境时会存在这个全域物件。
// 没有的话(比如在 Laptop / 一般浏览器测试)自动退回标准 window.print()。
function hasIminSDK() { return typeof window.IminPrintInstance !== 'undefined'; }
function checkIminSdkDiagnostic() {
  const el = document.getElementById('imin-diagnostic-result');
  if (!el) return;
  const exists = hasIminSDK();
  if (!exists) {
    el.innerHTML = `<div class="hint" style="color:var(--danger);font-weight:700">❌ window.IminPrintInstance 不存在(undefined)</div><p class="hint">代表这个网页目前没有取得iMin原生打印SDK,列印/开钱箱都是透过借用浏览器列印通道的方式在做。</p>`;
    return;
  }
  const P = window.IminPrintInstance;
  const methods = ['initPrinter','setPageFormat','setTextWidth','setAlignment','setTextSize','setTextStyle','printText','printColumnsText','openCashBox','partialCut'];
  const found = methods.filter(m => typeof P[m] === 'function');
  const missing = methods.filter(m => typeof P[m] !== 'function');
  el.innerHTML = `<div class="hint" style="color:var(--teal-deep);font-weight:700">✅ window.IminPrintInstance 存在!</div>
    <p class="hint">找到的方法(${found.length}/${methods.length}):${found.join('、')||'无'}</p>
    ${missing.length>0?`<p class="hint" style="color:var(--danger)">缺少的方法:${missing.join('、')}</p>`:''}`;
}

function ensurePrintPageSize() {
  // 告诉浏览器这次列印的实际纸张宽度(80mm或58mm),不然浏览器会默认当作A4/Letter尺寸排版,
  // 导致我们设定的收据宽度跟浏览器认知的页面宽度对不上,内容被裁掉。
  const mm = state.config.paperWidth === '58' ? '58mm' : '80mm';
  let styleEl = document.getElementById('print-page-size-style');
  if (!styleEl) { styleEl = document.createElement('style'); styleEl.id = 'print-page-size-style'; document.head.appendChild(styleEl); }
  styleEl.textContent = `@page { size: ${mm} auto; margin: 0; }`;
}
function printReceiptViaIminOrBrowser(sale, isReprint) {
  if (state.printingInProgress) return; // 防止短时间内连续点击造成重複列印/被合併成多页
  state.printingInProgress = true;
  setTimeout(() => { state.printingInProgress = false; }, 2000);
  if (hasIminSDK()) {
    try {
      printReceiptViaImin(sale, isReprint);
      return;
    } catch (e) {
      console.warn('iMin 打印失败,退回浏览器打印', e);
    }
  }
  // 标准浏览器打印(Laptop + Xprinter 路线,或 iMin SDK 尚未就绪时的安全退回)
  ensurePrintPageSize();
  setTimeout(() => window.print(), 200);
}

function printReceiptViaImin(sale, isReprint) {
  // 依照官方 JSPrinterSDK 文件(https://oss-sg.imin.sg/docs/en/JSPrinterSDK.html)校正過的呼叫方式。
  // 這是根據官方文件對照修正,但沒有實機測試過,實際字元寬度(colTotal)等數字可能需要現場微調。
  const P = window.IminPrintInstance;
  const baseTitle = sale.type==='exchange' ? 'Exchange Receipt' : sale.type==='return' ? 'Refund Receipt' : 'Receipt';
  const docTitle = isReprint ? 'Reprint ' + baseTitle : baseTitle;
  const w58 = state.config.paperWidth === '58';
  const lineWidth = w58 ? 384 : 576; // 官方文件:80mm有效印刷寬度576点,58mm為384点
  const colTotal = w58 ? 32 : 42; // 概略每行可容纳字元数(英文字元为单位,中文算2个),实机可能需要微调
  const setAlign = (a) => { if (P.setAlignment) P.setAlignment(a); };
  const setBold = (b) => { if (P.setTextStyle) P.setTextStyle(b ? 1 : 0); };
  const setSize = (s) => { if (P.setTextSize) P.setTextSize(s); };
  const printTwoCol = (left, right) => { if (P.printColumnsText) P.printColumnsText([left, right], [colTotal-10, 10], [0,2], [24,24], lineWidth); };
  try {
    if (P.initPrinter) P.initPrinter();
    if (P.setPageFormat) P.setPageFormat(w58 ? 1 : 0);
    if (P.setTextWidth) P.setTextWidth(lineWidth);

    setAlign(1); setBold(true); setSize(32);
    if (P.printText) P.printText(state.config.shopName + '\n');
    setSize(24);
    if (P.printText) P.printText(docTitle + '\n');
    setBold(false); setSize(22);
    if (state.config.addressLine1 && P.printText) P.printText(state.config.addressLine1 + '\n');
    if (state.config.addressLine2 && P.printText) P.printText(state.config.addressLine2 + '\n');
    if (state.config.addressLine3 && P.printText) P.printText(state.config.addressLine3 + '\n');
    if (state.config.phone && P.printText) P.printText('Tel: ' + state.config.phone + '\n');

    setAlign(0); setSize(24);
    if (P.printText) P.printText('Receipt no. : ' + (sale.transactionNumber||'') + '\n');
    if (P.printText) P.printText('Date : ' + fmtDateTimeWithYear(sale.timestamp) + '\n');
    if (P.printText) P.printText('Cashier : ' + sale.cashier + '\n');
    if (sale.memberName && P.printText) P.printText('Member : ' + sale.memberName + '\n');
    if (P.printText) P.printText('--------------------------------\n');
    for (const it of sale.items) {
      setBold(true);
      if (P.printText) P.printText(it.name + (it.promo?' (Promo)':'') + '\n');
      setBold(false); setSize(20);
      if (P.printText) P.printText('  ' + it.sku + '\n');
      setSize(24);
      printTwoCol(`${it.qty} x ${money(it.unitPrice)}`, money(it.qty*it.unitPrice));
    }
    if (P.printText) P.printText('--------------------------------\n');
    printTwoCol('Subtotal', money(sale.subtotal));
    if (sale.manualDiscountAmount>0) printTwoCol('Discount', '-'+money(sale.manualDiscountAmount));
    if (sale.discount>0) printTwoCol('Points Discount', '-'+money(sale.discount));
    if (sale.cashRoundingAdj!==0) printTwoCol('Rounding', (sale.cashRoundingAdj>0?'+':'')+money(sale.cashRoundingAdj));
    if (P.printText) P.printText('\n');
    setAlign(1); setBold(true); setSize(30);
    if (P.printText) P.printText('TOTAL ' + money(sale.total) + '\n');
    setBold(false); setSize(24); setAlign(0);
    for (const p of (sale.payments||[])) printTwoCol(p.method, money(p.amount));
    if (sale.cashTendered!=null) { printTwoCol('Cash Tendered', money(sale.cashTendered)); printTwoCol('Change', money(sale.changeGiven)); }
    if (sale.memberName) printTwoCol('Points Earned', '+'+sale.pointsEarned);
    setAlign(1);
    if (P.printText) P.printText('\nThank You and please come again!\n');
    setSize(18);
    if (P.printText) P.printText('We are happy to replace or exchange products return within 3 days from the purchase date as long as it\'s returned in it\'s original packaging, unused, sellable condition and in good time. No cash refund.\n\n\n');
    if (P.partialCut) P.partialCut();
  } catch (e) {
    console.warn('iMin printer call error', e);
    ensurePrintPageSize();
    setTimeout(() => window.print(), 200);
  }
}

function openDrawerViaIminOrBrowser() {
  if (hasIminSDK() && window.IminPrintInstance.openCashBox) {
    try { window.IminPrintInstance.openCashBox(); return; } catch (e) { console.warn('iMin 开钱箱失败', e); }
  }
  // 无 iMin SDK 时(Laptop + Xprinter 路线),退回打印通道尝试触发(实际是否弹开需现场测试)
  ensurePrintPageSize();
  try { window.print(); } catch(e) {}
}

function openCloseShiftModal() { state.closeShiftModalOpen = true; renderTab(); neutralizeFocus(); }
function closeCloseShiftModal() { state.closeShiftModalOpen = false; state.scanBuffers.close = ''; renderTab(); }
function computeShiftTotals(shiftId) {
  const salesInShift = state.sales.filter(s => s.shiftId === shiftId);
  const totals = { cash:0, creditCard:0, debitCard:0, ewallet:0, storeCredit:0, total:0, count: salesInShift.length };
  for (const s of salesInShift) {
    totals.total += s.total;
    const pays = (s.payments && s.payments.length) ? s.payments : [{ method: s.payMethod, amount: s.total }];
    for (const p of pays) {
      if (p.method==='Cash') totals.cash += p.amount;
      else if (p.method==='Credit Card') totals.creditCard += p.amount;
      else if (p.method==='Debit Card') totals.debitCard += p.amount;
      else if (p.method==='E-wallet') totals.ewallet += p.amount;
      else if (p.method==='Store Credit') totals.storeCredit += p.amount;
    }
  }
  return totals;
}
function renderCloseShiftModal(openShift) {
  if (!state.closeShiftModalOpen || !openShift) return '';
  const totals = computeShiftTotals(openShift.id);
  const expectedCash = openShift.startingCash + totals.cash;

  return `<div class="modal-backdrop" onclick="if(event.target===this) closeCloseShiftModal()">

      <div class="summary-row"><div>E-wallet</div><div class="val">${money(totals.ewallet)}</div></div>
      <div class="summary-row"><div>Store Credit</div><div class="val">${money(totals.storeCredit)}</div></div>
      <div class="summary-row total"><div>Total Sales</div><div class="val">${money(totals.total)}</div></div>
      <div class="section-title">现金核对</div>
      <div class="summary-row"><div>起始现金</div><div class="val">${money(openShift.startingCash)}</div></div>
      <div class="summary-row"><div>+ 现金销售</div><div class="val">${money(totals.cash)}</div></div>

      <div class="field" style="margin-top:10px"><label>实际点算现金 (RM)</label><input id="close-actual-cash" type="number" step="0.01" min="0" placeholder="点算後输入"></div>
      <div class="field"><label>扫描工卡授权关班</label>${renderScanField('close','扫描 barcode',true)}</div>
      <button class="btn btn-danger-solid btn-full" onclick="submitCloseShift('${escAttr(openShift.id)}', state.scanBuffers.close)">确认关班</button>
      <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeCloseShiftModal()">取消</button>

}
async function submitCloseShift(shiftId, barcode) {
  const staff = findStaffByBarcode(barcode);
  if (!staff) return showToast('找不到这个工卡编号', true);
  const actualCash = parseFloat(document.getElementById('close-actual-cash').value);
  if (isNaN(actualCash) || actualCash < 0) return showToast('请输入实际点算的现金', true);
  const shift = state.shifts.find(s => s.id === shiftId);
  if (!shift) return;
  const totals = computeShiftTotals(shiftId);
  const expectedCash = shift.startingCash + totals.cash;
  const variance = actualCash - expectedCash;
  const prev = { ...shift };
  shift.status = 'closed'; shift.closedBy = staff.id; shift.closedByName = staff.name; shift.closedAt = new Date().toISOString();
  shift.actualCash = actualCash; shift.expectedCash = expectedCash; shift.variance = variance; shift.totals = totals;
  state.scanBuffers.close = '';
  try {
    await gasUpsert('Shifts', shiftToRow(shift));
    showToast('已关班 ✓ 差异 ' + (variance>=0?'+':'') + money(variance));
    state.closeShiftModalOpen = false; state.currentStaff = null; state.tab='shifts'; state.shiftDetailId = shift.id;
    render();
  } catch(e) { Object.assign(shift, prev); showToast('保存失败', true); }
}

// ============ CHECKOUT ============
function activePrice(p) { return (p.promoActive && p.promoPrice != null && p.promoPrice !== '') ? Number(p.promoPrice) : Number(p.price); }
function handleScan(val) {
  const v = (val||'').trim(); if (!v) return;
  const vLower = v.toLowerCase();
  const p = state.products.find(pr => (pr.barcodes||[]).some(b=>b.toLowerCase()===vLower) || pr.sku.toLowerCase()===vLower);
  if (!p) { showToast('找不到 SKU / Barcode: '+v, true); return; }
  addToCart(p.sku);
}
function addToCart(sku) {
  const p = state.products.find(pr => pr.sku === sku); if (!p) return;
  const existing = state.cart.find(c => c.sku === sku);
  if (existing) existing.qty += 1;
  else state.cart.push({ sku:p.sku, name:p.name, brand:p.brand, price:Number(p.price), promoActive: !!p.promoActive, promoPrice: p.promoPrice!=null?Number(p.promoPrice):null, commission: Number(p.commission)||0, commissionType: p.commissionType||'fixed', qty:1, discountType:'amount', discountValue:0, discountNote:'' });
  renderTab(); resetIdleTimer();
}
function changeQty(sku, delta) {
  const item = state.cart.find(c => c.sku === sku); if (!item) return;
  item.qty += delta; if (item.qty <= 0) state.cart = state.cart.filter(c => c.sku !== sku);
  renderTab(); resetIdleTimer();
}
function removeFromCart(sku) { state.cart = state.cart.filter(c => c.sku !== sku); renderTab(); resetIdleTimer(); }
function clearCart() { state.cart = []; state.selectedMember = null; state.redeemPoints = 0; state.cashTendered = null; state.paymentLines = []; state.manualDiscount = { type:'amount', value:0, note:'' }; state.itemDiscountModalSku = null; state.discountModalOpen = false; renderTab(); resetIdleTimer(); }
function cartSubtotal() { return state.cart.reduce((sum,c) => sum + (c.promoActive && c.promoPrice!=null ? c.promoPrice : c.price) * c.qty, 0); }
function itemBaseLineTotal(c) { return (c.promoActive && c.promoPrice!=null ? c.promoPrice : c.price) * c.qty; }
function itemDiscountAmount(c) {
  if (!c.discountValue) return 0;
  const base = itemBaseLineTotal(c);
  if (c.discountType === 'percent') return Math.min(base, round2(base * c.discountValue / 100));
  return Math.min(base, c.discountValue);
}
function itemLineTotal(c) { return Math.max(0, itemBaseLineTotal(c) - itemDiscountAmount(c)); }
function cartItemDiscountsTotal() { return state.cart.reduce((sum,c) => sum + itemDiscountAmount(c), 0); }
function cartSubtotalAfterItemDiscounts() { return state.cart.reduce((sum,c) => sum + itemLineTotal(c), 0); }
function itemUnitCommission(c) {
  const unitPrice = c.promoActive && c.promoPrice!=null ? c.promoPrice : c.price;
  return c.commissionType === 'percent' ? unitPrice * (c.commission||0) / 100 : (c.commission||0);
}
function cartCommission() { return state.cart.reduce((sum,c) => sum + itemUnitCommission(c) * c.qty, 0); }
function isEditingManager() { return state.editingStaff && state.editingStaff.role === 'manager'; }
function tierClass(tierName) {
  const n = (tierName||'').toLowerCase();
  if (n.includes('platinum')) return 'platinum';
  if (n.includes('gold')) return 'gold';
  if (n.includes('silver')) return 'silver';
  return 'base';
}
function getMemberRates(member) {
  if (!member) return { earnRate: state.config.pointsPerRM||0, redeemRate: state.config.pointValueRM||0.1 };
  const tier = (state.config.tiers||[]).find(t => t.name === member.tier);
  return tier ? { earnRate: tier.earnRate, redeemRate: tier.redeemRate } : { earnRate: state.config.pointsPerRM||0, redeemRate: state.config.pointValueRM||0.1 };
}
function maxRedeemablePoints() {
  if (!state.selectedMember) return 0;
  const subtotal = cartSubtotalAfterItemDiscounts();
  const rates = getMemberRates(state.selectedMember);
  return Math.max(0, Math.min(state.selectedMember.points, Math.floor(subtotal / (rates.redeemRate||0.1))));
}
function redeemDiscount() { const rates = getMemberRates(state.selectedMember); return (state.redeemPoints||0) * (rates.redeemRate||0.1); }
function manualDiscountAmount() {
  const md = state.manualDiscount; if (!md || !md.value) return 0;
  const base = cartSubtotalAfterItemDiscounts();
  if (md.type === 'percent') return Math.min(base, round2(base * md.value / 100));
  return Math.min(base, md.value);
}
function preRoundTotal() { return Math.max(0, cartSubtotalAfterItemDiscounts() - redeemDiscount() - manualDiscountAmount()); }
function roundToNearest5Cent(amt) { return Math.round(amt * 20) / 20; }
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function checkoutHasCashLine() { return state.paymentLines.some(l => l.method === 'Cash'); }
function cartTotal() { return checkoutHasCashLine() ? roundToNearest5Cent(preRoundTotal()) : preRoundTotal(); }
function cashRoundingAdj() { return round2(cartTotal() - preRoundTotal()); }
function paymentLinesSum() { return round2(state.paymentLines.reduce((s,l) => s + (l.amount||0), 0)); }
function checkoutRemaining() { return Math.max(0, round2(cartTotal() - paymentLinesSum())); }
function checkoutOverpaid() { return Math.max(0, round2(paymentLinesSum() - cartTotal())); }
function pointsEarnedPreview() { const rates = getMemberRates(state.selectedMember); return Math.floor(cartTotal() * (rates.earnRate||0)); }
function selectMember(id) { state.selectedMember = state.members.find(m=>m.id===id)||null; state.redeemPoints=0; state.memberSearch=''; renderTab(); resetIdleTimer(); }
function deselectMember() { state.selectedMember = null; state.redeemPoints = 0; state.paymentLines = state.paymentLines.filter(l=>l.method!=='Store Credit'); renderTab(); resetIdleTimer(); }
function setRedeemPoints(val) {

  state.redeemPoints=n; renderTab(); resetIdleTimer();

}
function setManualDiscountType(type) { state.manualDiscount.type = type; renderTab(); resetIdleTimer(); }
function setManualDiscountValue(val) {

}
function setManualDiscountNote(val) { state.manualDiscount.note = val; }
function clearManualDiscount() { state.manualDiscount = { type:'amount', value:0, note:'' }; renderTab(); resetIdleTimer(); }
function openDiscountModal() { state.discountModalOpen = true; renderTab(); }
function closeDiscountModal() { state.discountModalOpen = false; renderTab(); }
function openItemDiscountModal(sku) { state.itemDiscountModalSku = sku; renderTab(); }
function closeItemDiscountModal() { state.itemDiscountModalSku = null; renderTab(); }
function setItemDiscountType(sku, type) { const it = state.cart.find(c=>c.sku===sku); if (it) { it.discountType = type; renderTab(); } }
function setItemDiscountValue(sku, val) {

function addPaymentLine(method) {
  const remaining = checkoutRemaining();
  if (remaining <= 0.001) return showToast('金额已经付清了', true);
  let amount = remaining;
  if (method === 'Store Credit') {
    if (!state.selectedMember) return showToast('请先选择会员才能用Store Credit', true);
    const avail = Math.max(0, (state.selectedMember.storeCredit||0) - state.paymentLines.filter(l=>l.method==='Store Credit').reduce((s,l)=>s+l.amount,0));
    if (avail <= 0) return showToast('这位会员没有可用的Store Credit餘额', true);
    amount = Math.min(remaining, avail);
  }
  state.paymentLines.push({ method, amount: round2(amount) });
  renderTab(); resetIdleTimer();
}
function removePaymentLine(idx) { state.paymentLines.splice(idx,1); renderTab(); resetIdleTimer(); }
function updatePaymentLineAmount(idx, val) {
  const line = state.paymentLines[idx]; if (!line) return;
  let n = parseFloat(String(val).replace(/[^0-9.]/g,'')); if (isNaN(n) || n<0) n = 0;
  if (line.method === 'Store Credit' && state.selectedMember) {
    const usedByOthers = state.paymentLines.filter((l,i)=>i!==idx && l.method==='Store Credit').reduce((s,l)=>s+l.amount,0);
    n = Math.min(n, Math.max(0, (state.selectedMember.storeCredit||0) - usedByOthers));
  }
  line.amount = round2(n);
  renderTab(); resetIdleTimer();
}

function maybeUpgradeTier(member) {
  const tiers = [...(state.config.tiers||[])].sort((a,b)=>a.threshold-b.threshold);
  if (tiers.length===0) return;
  const currentRank = tiers.findIndex(t => t.name === member.tier);
  let bestRank = currentRank;
  for (let i=0;i<tiers.length;i++) {
    if ((member.totalSpend||0) >= tiers[i].threshold && i > bestRank) bestRank = i;
  }
  if (bestRank > currentRank && bestRank >= 0) member.tier = tiers[bestRank].name;
}
async function checkout(shiftId) {
  if (state.checkoutSubmitting) return; // 防止连续点击造成重複结帐
  if (state.cart.length===0) return showToast('购物车是空的', true);
  if (checkoutRemaining() > 0.001) return showToast('金额还没付清', true);
  state.checkoutSubmitting = true;
  renderTab();
  const subtotal = cartSubtotal(), discount = redeemDiscount(), total = cartTotal(), roundAdj = cashRoundingAdj();
  const pointsEarned = state.selectedMember ? pointsEarnedPreview() : 0;
  const pointsRedeemed = state.selectedMember ? state.redeemPoints : 0;
  const commissionTotal = cartCommission();
  const mdAmount = manualDiscountAmount();
  const payments = state.paymentLines.map(l => ({ method:l.method, amount:l.amount }));
  const hasCash = payments.some(p => p.method === 'Cash');
  const cashTendered = hasCash ? round2(payments.filter(p=>p.method==='Cash').reduce((s,p)=>s+p.amount,0)) : null;
  const overpaid = checkoutOverpaid();
  const changeGiven = hasCash && overpaid > 0.001 ? overpaid : (hasCash ? 0 : null);
  const sale = {
    id:'sale_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), timestamp:new Date().toISOString(), shiftId, transactionNumber: generateTransactionNumber('sale'),
    cashier: state.currentStaff.name, cashierId: state.currentStaff.id,
    commissionStaff: state.currentStaff.name, commissionStaffId: state.currentStaff.id, commissionTotal,
    items: state.cart.map(c => {
      const baseUnitPrice = c.promoActive && c.promoPrice!=null ? c.promoPrice : c.price;
      const lineDiscount = itemDiscountAmount(c);
      const effectiveUnitPrice = round2(itemLineTotal(c) / c.qty);
      return { sku:c.sku, name:c.name, qty:c.qty, unitPrice: effectiveUnitPrice, originalUnitPrice: baseUnitPrice, promo:!!c.promoActive, commission: itemUnitCommission(c),
        discountAmount: lineDiscount, discountType: c.discountType||'amount', discountNote: c.discountNote||'' };
    }),
    subtotal, discount, cashRoundingAdj: roundAdj, total, payMethod: payments[0]?payments[0].method:'Cash', payments, cashTendered, changeGiven,
    memberId: state.selectedMember?state.selectedMember.id:null, memberName: state.selectedMember?state.selectedMember.name:null,
    pointsEarned, pointsRedeemed, type:'sale', refSaleId:null, processedBy: state.currentStaff.name,
    manualDiscountAmount: mdAmount, manualDiscountType: state.manualDiscount.type, manualDiscountNote: state.manualDiscount.note, manualDiscountValue: state.manualDiscount.value,
  };
  state.sales.push(sale);
  let memberBackup = null;
  if (state.selectedMember) {
    const m = state.members.find(x=>x.id===state.selectedMember.id);
    if (m) {
      memberBackup={...m};
      m.points = m.points - pointsRedeemed + pointsEarned;
      m.totalSpend = (m.totalSpend||0) + total;
      const storeCreditUsed = payments.filter(p=>p.method==='Store Credit').reduce((s,p)=>s+p.amount,0);
      m.storeCredit = Math.max(0, (m.storeCredit||0) - storeCreditUsed);
      maybeUpgradeTier(m);
    }
  }
  try {
    await gasUpsert('Sales', saleToRow(sale));
    if (state.selectedMember) { const m = state.members.find(x=>x.id===state.selectedMember.id); if (m) await gasUpsert('Members', memberToRow(m)); }
    state.checkoutSubmitting = false;
    if (hasCash) {
      openDrawerViaIminOrBrowser();
      state.pendingReceiptSale = sale;
      state.changeModalInfo = { tendered: cashTendered, change: changeGiven };
      renderTab();
    } else {
      showReceipt(sale);
      state.cart = []; state.currentStaff = null; state.selectedMember = null; state.redeemPoints = 0; state.cashTendered = null; state.paymentLines = []; state.manualDiscount = { type:'amount', value:0, note:'' }; state.itemDiscountModalSku = null; state.discountModalOpen = false;
      if (state.idleTimer) clearTimeout(state.idleTimer);
      showToast('结帐完成 ✓'); render();
    }
  } catch(e) { state.checkoutSubmitting = false; state.sales.pop(); if (memberBackup) { const m=state.members.find(x=>x.id===memberBackup.id); if(m) Object.assign(m, memberBackup); } showToast('结帐失败,请重试', true); }
}

function getTierThreshold(tierName) {
  const t = (state.config.tiers||[]).find(t => t.name === tierName);
  return t ? (t.threshold||0) : 0;
}
function matchTierName(raw) {
  const r = raw.toLowerCase();
  const tiers = state.config.tiers || [];
  const exact = tiers.find(t => t.name.toLowerCase() === r);
  if (exact) return exact.name;
  const partial = tiers.find(t => r.includes(t.name.toLowerCase().replace(' member','')) );
  if (partial) return partial.name;
  return null;
}
async function addMember() {
  const name = document.getElementById('m-name').value.trim(); const phone = document.getElementById('m-phone').value.trim();

  if (state.members.some(m=>m.phone===phone)) return showToast('这个电话号码已经是会员', true);
  const member = { id:'mem_'+Date.now(), name, phone, points, joinDate:new Date().toISOString(), tier:'Member', totalSpend:0 };
  state.members.push(member);
  try { await gasUpsert('Members', memberToRow(member)); showToast('已新增会员 ✓'); renderTab(); } catch(e) { state.members.pop(); showToast('保存失败', true); }
}
function downloadMemberTemplate() {
  const sample = [
    { name:'Tan Mei Ling', phone:'0123456789', points:0, membership_tier:'Member' },
    { name:'Lim Ah Kow', phone:'0198765432', points:50, membership_tier:'Silver Member' },
  ];
  const ws = XLSX.utils.json_to_sheet(sample, { header:['name','phone','points','membership_tier'] });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'members');
  XLSX.writeFile(wb, 'member_import_template.xlsx');
}
async function handleMemberImport(input) {
  const file = input.files[0]; if (!file) return;
  const resultEl = document.getElementById('member-import-result');
  resultEl.innerHTML = '<div class="hint">正在解析…</div>';
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    let added = 0, updated = 0, skipped = 0;
    const touched = [];
    for (const r of rows) {
      let name = String(r.name || r.Name || '').trim();
      if (!name) {
        const first = String(r.firstname || r.first_name || '').trim();
        const last = String(r.lastname || r.last_name || '').trim();
        name = (first + ' ' + last).trim();
      }
      let phone = String(r.phone || r.Phone || '').trim();
      if (!name || !phone) { skipped++; continue; }
      let pointsRaw = r.points ?? r.Points ?? r.reward_points ?? r.new_reward_points ?? 0;
      if (pointsRaw === '' || pointsRaw == null) pointsRaw = 0;
      const points = Math.round(parseFloat(pointsRaw) * 100) / 100 || 0;
      const tierRaw = String(r.membership_tier || r.tier || r.Tier || '').trim();
      const matchedTier = tierRaw ? matchTierName(tierRaw) : null;
      const tierThreshold = matchedTier ? getTierThreshold(matchedTier) : 0;
      const existing = state.members.find(m => m.phone === phone);
      if (existing) {
        existing.name = name; existing.points = points;
        if (matchedTier) existing.tier = matchedTier;
        existing.totalSpend = Math.max(existing.totalSpend||0, tierThreshold);
        updated++; touched.push(memberToRow(existing));
      } else {
        const m = { id:'mem_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name, phone, points, joinDate:new Date().toISOString(), tier: matchedTier||'Member', totalSpend: tierThreshold };
        state.members.push(m); added++; touched.push(memberToRow(m));
      }
    }
    await gasBulkUpsert('Members', touched);
    resultEl.innerHTML = `<div class="hint" style="color:var(--teal-deep);font-weight:700">✓ 新增 ${added} 笔,更新 ${updated} 笔${skipped>0?`,略过 ${skipped} 笔(缺少姓名/电话)`:''}</div>`;
    showToast('匯入完成 ✓'); renderTab();
  } catch (e) {
    resultEl.innerHTML = '<div class="hint" style="color:var(--danger)">解析失败,请确认档案格式是否正确</div>';
    showToast('匯入失败', true);
  }
  input.value = '';
}

  state.pendingReturnSaleId = saleId; state.returnAuthOpen = true; state.scanBuffers.returnAuth = '';
  renderTab(); neutralizeFocus();
}
function cancelReturnAuth() { state.returnAuthOpen = false; state.pendingReturnSaleId = null; state.scanBuffers.returnAuth = ''; renderTab(); }
function submitReturnAuth(barcode) {
  const staff = findStaffByBarcode(barcode);
  if (!staff) return showToast('找不到这个工卡编号', true);
  const saleId = state.pendingReturnSaleId;
  state.returnAuthOpen = false; state.pendingReturnSaleId = null; state.scanBuffers.returnAuth = '';
  state.returnStaff = staff;
  openReturnEditor(saleId);
}
function renderReturnAuthModal() {
  if (!state.returnAuthOpen) return '';
  return `<div class="modal-backdrop" onclick="if(event.target===this) cancelReturnAuth()">
    <div class="modal">
      <h2 style="margin-top:0">🔒 扫工卡才能处理退货/换货</h2>
      <p class="hint">系统会记录是谁处理的。</p>
      <div class="field">${renderScanField('returnAuth','扫描 barcode',true)}</div>
      <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="cancelReturnAuth()">取消</button>
    </div>
  </div>`;
}

function getAlreadyReturnedMap(saleId) {
  const map = {};
  for (const s of state.sales) {
    if (s.refSaleId !== saleId) continue;
    if (s.type !== 'return' && s.type !== 'exchange') continue;
    for (const it of s.items) {
      if (it.qty < 0) map[it.sku] = (map[it.sku]||0) + (-it.qty);
    }
  }
  return map;
}
function isSaleFullyReturned(sale) {
  const returned = getAlreadyReturnedMap(sale.id);
  return sale.items.every(it => (returned[it.sku]||0) >= it.qty);
}
function openReturnEditor(saleId) {
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const returned = getAlreadyReturnedMap(saleId);
  state.returnOrigSale = sale;
  state.returnItems = sale.items.map(it => {
    const already = returned[it.sku] || 0;
    return { sku:it.sku, name:it.name, unitPrice:it.unitPrice, commission:it.commission||0, maxQty: Math.max(0, it.qty - already), alreadyReturned: already, returnQty:0 };
  });
  state.returnNewCart = [];
  state.returnPaymentLines = [];
  state.returnModalOpen = true;
  renderTab(); neutralizeFocus();
}
function cancelReturnModal() { state.returnModalOpen = false; state.returnOrigSale = null; state.returnItems = []; state.returnNewCart = []; state.returnPaymentLines = []; state.returnStaff = null; state.returnSubmitting = false; renderTab(); }
function changeReturnQty(sku, delta) {
  const it = state.returnItems.find(x => x.sku === sku); if (!it) return;
  it.returnQty = Math.max(0, Math.min(it.maxQty, it.returnQty + delta));
  state.returnPaymentLines = []; // 明细变了,结算重新来
  renderTab();
}
function returnRefundAmount() { return state.returnItems.reduce((sum,it) => sum + it.unitPrice * it.returnQty, 0); }
function returnCommissionReversal() { return state.returnItems.reduce((sum,it) => sum + (it.commission||0) * it.returnQty, 0); }
function addReturnNewItem(sku) {
  const p = state.products.find(pr => pr.sku === sku || (pr.barcodes||[]).includes(sku));
  if (!p) return showToast('找不到 SKU / Barcode: '+sku, true);
  const existing = state.returnNewCart.find(c => c.sku === p.sku);
  if (existing) existing.qty += 1;
  else state.returnNewCart.push({ sku:p.sku, name:p.name, price: activePrice(p), commission: (p.commissionType==='percent' ? activePrice(p)*(p.commission||0)/100 : (p.commission||0)), qty:1 });
  state.returnPaymentLines = [];
  renderTab();
}
function changeReturnNewQty(sku, delta) {
  const it = state.returnNewCart.find(x => x.sku === sku); if (!it) return;
  it.qty += delta;
  if (it.qty <= 0) state.returnNewCart = state.returnNewCart.filter(x => x.sku !== sku);
  state.returnPaymentLines = [];
  renderTab();
}
function returnNewItemsTotal() { return state.returnNewCart.reduce((sum,it) => sum + it.price*it.qty, 0); }
function returnNewItemsCommission() { return state.returnNewCart.reduce((sum,it) => sum + it.commission*it.qty, 0); }
function returnNetAmount() { return round2(returnNewItemsTotal() - returnRefundAmount()); }
function returnPaymentTarget() { return Math.abs(returnNetAmount()); }
function returnPaymentLinesSum() { return round2(state.returnPaymentLines.reduce((s,l)=>s+(l.amount||0),0)); }
function returnPaymentRemaining() { return Math.max(0, round2(returnPaymentTarget() - returnPaymentLinesSum())); }
function addReturnPaymentLine(method) {
  const remaining = returnPaymentRemaining();
  if (remaining <= 0.001) return showToast('金额已经凑齐了', true);
  const net = returnNetAmount();
  let amount = remaining;
  if (method === 'Store Credit') {
    const member = state.returnOrigSale.memberId ? state.members.find(m=>m.id===state.returnOrigSale.memberId) : null;
    if (!member) return showToast('这笔交易没有会员,无法用Store Credit', true);
    if (net > 0) { // 客户补款方向,须有足够餘额可扣
      const usedByOthers = state.returnPaymentLines.filter(l=>l.method==='Store Credit').reduce((s,l)=>s+l.amount,0);
      const avail = Math.max(0, (member.storeCredit||0) - usedByOthers);
      if (avail <= 0) return showToast('这位会员没有可用的Store Credit餘额', true);
      amount = Math.min(remaining, avail);
    }
    // net < 0(退款方向)是发放/增加餘额,不需要检查现有餘额上限
  }
  state.returnPaymentLines.push({ method, amount: round2(amount) });
  renderTab();
}
function removeReturnPaymentLine(idx) { state.returnPaymentLines.splice(idx,1); renderTab(); }
function updateReturnPaymentLineAmount(idx, val) {
  const line = state.returnPaymentLines[idx]; if (!line) return;
  let n = parseFloat(String(val).replace(/[^0-9.]/g,'')); if (isNaN(n)||n<0) n = 0;
  line.amount = round2(n);
  renderTab();
}
function renderReturnModal() {
  if (!state.returnModalOpen) return '';
  const sale = state.returnOrigSale;
