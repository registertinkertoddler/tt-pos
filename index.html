async function submitReturnExchange() {
  if (state.returnSubmitting) return; // prevent rapid repeated clicks from causing a duplicate return/exchange
  const openShift = getOpenShift();
  if (!openShift) return showToast('No shift is currently open, cannot process a return/exchange', true);
  const returned = state.returnItems.filter(it => it.returnQty > 0);
  if (returned.length===0 && state.returnNewCart.length===0) return showToast('Please select items to return or add new items', true);
  const net = returnNetAmount();
  if (Math.abs(net) > 0.001 && returnPaymentRemaining() > 0.001) return showToast('Settlement amount not fully covered yet', true);
  state.returnSubmitting = true;
  renderTab();
  const items = [
    ...returned.map(it => ({ sku:it.sku, name:it.name, qty:-it.returnQty, unitPrice:it.unitPrice, promo:false, commission:it.commission })),
    ...state.returnNewCart.map(it => ({ sku:it.sku, name:it.name, qty:it.qty, unitPrice:it.price, promo:false, commission:it.commission })),
  ];
  const commissionTotal = items.reduce((sum,it) => sum + it.commission*it.qty, 0);
  const refund = returnRefundAmount();
  const type = state.returnNewCart.length>0 ? 'exchange' : 'return';
  const origSale = state.returnOrigSale;
  const sign = net < 0 ? -1 : 1;
  const payments = state.returnPaymentLines.map(l => ({ method:l.method, amount: round2(l.amount * sign) }));

  // ---- Automatic member points adjustment ----
  let pointsEarnedField = 0, pointsRedeemedField = 0;
  const member = origSale.memberId ? state.members.find(m => m.id === origSale.memberId) : null;
  if (member) {
    const ratio = origSale.total ? Math.min(1, refund / Math.abs(origSale.total)) : 0;
    const earnedReversal = Math.round((origSale.pointsEarned||0) * ratio);   // Deduct originally-earned points proportional to the return
    const redeemedRefund = Math.round((origSale.pointsRedeemed||0) * ratio); // Refund originally-spent points proportional to the return
    const rates = getMemberRates(member);
    const newItemsEarned = net > 0 ? Math.floor(net * (rates.earnRate||0)) : 0; // The extra amount paid in an exchange earns points normally at the member's current tier
    pointsEarnedField = newItemsEarned - earnedReversal;
    pointsRedeemedField = -redeemedRefund;
  }

  const record = {
    // Commission always goes to the staff member of the original sale, not whoever processes the return;processedBy separately records who actually carried out this return/exchange
    id:'ret_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), timestamp:new Date().toISOString(), shiftId: openShift.id, transactionNumber: generateTransactionNumber(type),
    cashier: origSale.cashier, cashierId: origSale.cashierId, commissionStaff: origSale.commissionStaff, commissionStaffId: origSale.commissionStaffId,
    commissionTotal, items, subtotal: net, discount:0, cashRoundingAdj:0, total: net,
    payMethod: payments[0]?payments[0].method:'—', payments, cashTendered:null, changeGiven:null,
    memberId: origSale.memberId||null, memberName: origSale.memberName||null, pointsEarned: pointsEarnedField, pointsRedeemed: pointsRedeemedField,
    type, refSaleId: origSale.id, processedBy: state.returnStaff.name,
  };
  state.sales.push(record);
  let memberBackup = null;
  if (member) {
    memberBackup = { ...member };
    member.points = Math.max(0, member.points - pointsRedeemedField + pointsEarnedField);
    member.totalSpend = Math.max(0, (member.totalSpend||0) + net);
    // Store Credit Settlement: refund direction (net<0) issues/adds balance; customer-pays direction (net>0) deducts the balance used
    for (const p of payments) {
      if (p.method === 'Store Credit') member.storeCredit = Math.max(0, (member.storeCredit||0) - p.amount);
    }
    maybeUpgradeTier(member);
  }
  try {
    await gasUpsert('Sales', saleToRow(record));
    if (member) await gasUpsert('Members', memberToRow(member));
    if (payments.some(p=>p.method==='Cash') && net !== 0) printReturnSlip(record);
    showToast((type==='exchange'?'Exchange':'Return')+' processing complete ✓'+(member?` · points adjustment ${pointsEarnedField-pointsRedeemedField>=0?'+':''}${pointsEarnedField-pointsRedeemedField}`:''));
    cancelReturnModal();
  } catch(e) { state.returnSubmitting = false; state.sales.pop(); if (memberBackup) Object.assign(member, memberBackup); showToast('Save failed', true); renderTab(); }
}

function downloadProductTemplate() {

    { brand:'Attipas', sku:'AT-BLK-M', barcodes:'1234567890123,9876543210987', name:'Classic Toddler Shoe Black M', price:89, promoPrice:'', commissionType:'fixed', commission:2 },
    { brand:'Firgi', sku:'FG-POT-01', barcodes:'6912345678901', name:'Non-Stick Pan 20cm', price:129, promoPrice:99, commissionType:'percent', commission:5 },
  ];
  const ws = XLSX.utils.json_to_sheet(sample, { header:['brand','sku','barcodes','name','price','promoPrice','commissionType','commission'] });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'products');
  XLSX.writeFile(wb, 'product_import_template.xlsx');
}
async function handleProductImport(input) {
  const file = input.files[0]; if (!file) return;
  const resultEl = document.getElementById('product-import-result');
  resultEl.innerHTML = '<div class="hint">Parsing…</div>';
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    let added = 0, updated = 0, skipped = 0;
    const touched = [];
    for (const r of rows) {
      const sku = String(r.sku || r.SKU || r.ISKU || r.isku || r.iSKU || '').trim();
      const name = String(r.name || r.Name || '').trim();
      const price = parseFloat(r.price ?? r.Price);
      if (!sku || !name || isNaN(price)) { skipped++; continue; }
      const brand = String(r.brand || r.Brand || '').trim();
      const promoRaw = r.promoPrice ?? r.promo_price ?? r.PromoPrice ?? '';
      const promoPrice = promoRaw !== '' && !isNaN(parseFloat(promoRaw)) ? parseFloat(promoRaw) : null;
      const commission = parseFloat(r.commission ?? r.Commission) || 0;
      const commissionTypeRaw = String(r.commissionType || r.commission_type || r.CommissionType || 'fixed').trim().toLowerCase();
      const commissionType = commissionTypeRaw === 'percent' || commissionTypeRaw === '%' ? 'percent' : 'fixed';
      const barcodesRaw = String(r.barcodes || r.Barcodes || r.barcode || '').trim();
      const barcodes = barcodesRaw ? barcodesRaw.split(',').map(b=>b.trim()).filter(Boolean) : [];
      const existing = state.products.find(p => p.sku === sku);
      if (existing) { Object.assign(existing, { brand, name, price, promoPrice, promoActive: promoPrice!=null, commission, commissionType, barcodes: barcodes.length?barcodes:(existing.barcodes||[]) }); updated++; touched.push(productToRow(existing)); }
      else { const p = { brand, sku, name, price, promoPrice, promoActive: promoPrice!=null, commission, commissionType, barcodes }; state.products.push(p); added++; touched.push(productToRow(p)); }
    }
    await gasBulkUpsert('Products', touched);
    resultEl.innerHTML = `<div class="hint" style="color:var(--teal-deep);font-weight:700">✓ Added ${added} , updated ${updated} ${skipped>0?`, skipped ${skipped} (missing SKU/name/original price)`:''}</div>`;
    showToast('Import complete ✓'); renderTab();
  } catch (e) {
    resultEl.innerHTML = '<div class="hint" style="color:var(--danger)">Parse failed, please check the file format</div>';
    showToast('Import failed', true);
  }
  input.value = '';
}
async function doRemoveProduct(sku) {
  const idx = state.products.findIndex(p=>p.sku===sku); if (idx===-1) return; const removed = state.products.splice(idx,1)[0];
  try { await gasDelete('Products', sku); showToast('Product removed'); renderTab(); } catch(e) { state.products.splice(idx,0,removed); showToast('Save failed', true); }
}

function filteredSales() {
  let list = [...state.sales];
  if (state.recFilterStaff) list = list.filter(s => s.cashierId === state.recFilterStaff);
  if (state.recFilterDate) list = list.filter(s => s.timestamp.slice(0,10) === state.recFilterDate);
  const q = (state.recSearchQuery||'').trim().toLowerCase();
  if (q) list = list.filter(s =>
    (s.transactionNumber||'').toLowerCase().includes(q) ||
    (s.memberName||'').toLowerCase().includes(q) ||
    s.items.some(it => it.name.toLowerCase().includes(q) || it.sku.toLowerCase().includes(q))
  );
  return list.reverse();
}

function submitSettingsAuth(barcode) {
  const staff = findStaffByBarcode(barcode);
  if (!staff) return showToast('Work card number not found', true);
  if (staff.role !== 'manager') return showToast('Settings require manager permission', true);
  state.settingsAuthStaff = staff;
  state.scanBuffers.settingsAuth = '';
  renderTab();

function submitSettingsPasswordFallback() {
  const input = document.getElementById('settings-fallback-password');
  const pw = input ? input.value : '';
  if (pw !== state.config.adminPassword) return showToast('Incorrect password', true);
  state.settingsAuthStaff = { name: 'Password Unlock', role: 'manager', id: 'password-override' };
  state.settingsPasswordFallback = false;

async function exportCommission() {
  if (state.commissionAuthStaff && state.commissionAuthStaff.role !== 'manager') return showToast('Only managers can export the commission Excel', true);
  let list = filteredSales();
  if (list.length===0) return showToast('No data to export', true);
  const rows = list.map(s => ({ date: s.timestamp.slice(0,10), time: fmtDateTime(s.timestamp), staff: s.commissionStaff, items: s.items.length, commission: s.commissionTotal }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Commission');
  const filename = 'commission_'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb, filename);
  showToast('Downloaded ✓ syncing to Drive…');
  try {
    const base64 = XLSX.write(wb, { type:'base64', bookType:'xlsx' });
    await gasSaveFile(filename, base64, XLSX_MIME);
    showToast('Saved to Google Drive ✓');
  } catch(e) { showToast('Downloaded, but saving to Drive failed', true); }
}

async function exportSiteGiant(shiftId) {
  const salesInShift = state.sales.filter(s => s.shiftId === shiftId);
  if (salesInShift.length===0) return showToast('This shift has no sales records', true);
  const skuMap = {};
  for (const s of salesInShift) for (const it of s.items) { skuMap[it.sku] = (skuMap[it.sku]||0) + it.qty; }
  const rows = Object.keys(skuMap).map(sku => ({ isku: sku, quantity_change: -skuMap[sku] }));
  const ws = XLSX.utils.json_to_sheet(rows, { header:['isku','racks','batches','quantity_change'] });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'stock-adjustment');
  const filename = 'stock_adjustment_'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb, filename);
  showToast('Downloaded ✓ syncing to Drive…');
  try {
    const base64 = XLSX.write(wb, { type:'base64', bookType:'xlsx' });
    await gasSaveFile(filename, base64, XLSX_MIME);
    showToast('Saved to Google Drive ✓');
  } catch(e) { showToast('Downloaded, but saving to Drive failed', true); }
}

// ============ SETTINGS ============
function renderSettings() {
  if (!state.settingsAuthStaff) {
    return `
      <div class="gate-wrap">
        <div class="gate-icon">🔒</div>
        <div class="gate-title">Scan a manager card to enter Settings</div>
        <div class="gate-sub">Settings involve sensitive configuration like shop info, points rules, and staff management</div>
        <div class="card">
          <div class="field">${renderScanField('settingsAuth','Scan barcode',true)}</div>
          ${state.settingsPasswordFallback ? `
            <div class="field" style="margin-top:12px">
              <label>Admin password (backup unlock method)</label>
              <input id="settings-fallback-password" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter'){event.preventDefault(); submitSettingsPasswordFallback();}">
            </div>
            <button class="btn btn-primary btn-full" onclick="submitSettingsPasswordFallback()">Unlock with Password</button>
          ` : `<p class="hint" style="margin-top:12px;text-align:center"><a style="cursor:pointer;color:var(--teal)" onclick="state.settingsPasswordFallback=true; renderTab();">Don't have a manager card handy? Unlock with the admin password</a></p>`}
        </div>
      </div>`;
  }
  return `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div class="hint" style="margin:0">Authorized by <b style="color:var(--ink)">${esc(state.settingsAuthStaff.name)}</b></div>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="state.settingsAuthStaff=null; renderTab();">Leave Settings</button>
    </div>
    <div class="card">
      <h2>Shop Info (Receipt Header)</h2>
      <div class="field"><label>Shop Name</label><input id="s-shopname" value="${esc(state.config.shopName)}"></div>
      <div class="field"><label>Address (Line 1)</label><input id="s-address1" value="${esc(state.config.addressLine1||'')}"></div>
      <div class="field"><label>Address (Line 2)</label><input id="s-address2" value="${esc(state.config.addressLine2||'')}"></div>
      <div class="field"><label>Address (Line 3, optional)</label><input id="s-address3" value="${esc(state.config.addressLine3||'')}"></div>
      <div class="row">
        <div class="field"><label>Phone</label><input id="s-phone" value="${esc(state.config.phone)}"></div>
        <div class="field"><label>SST Registration No.</label><input id="s-sst" value="${esc(state.config.sstNo)}"></div>
      </div>
      <div class="field"><label>Receipt Paper Width</label>
        <select id="s-paperwidth"><option value="80" ${state.config.paperWidth==='80'?'selected':''}>80mm</option><option value="58" ${state.config.paperWidth==='58'?'selected':''}>58mm</option></select>
      </div>
      <button class="btn btn-primary" onclick="saveShopInfo()">Save Shop Info</button>
    </div>
    <div class="card">
      <h2>Points Rules (default rate, for tierless members/guests)</h2>
      <div class="row">
        <div class="field"><label>Earn Rate (points earned per RM1 spent)</label><input id="s-earn" type="number" step="0.1" min="0" value="${state.config.pointsPerRM}"></div>
        <div class="field"><label>Redeem Rate (1 point = how many RM)</label><input id="s-redeem" type="number" step="0.01" min="0" value="${state.config.pointValueRM}"></div>
      </div>
      <button class="btn btn-primary" onclick="savePointsRules()">Save Points Rules</button>
    </div>
    <div class="card">
      <h2>Membership Tiers</h2>
      <p class="hint">Auto-upgrades based on cumulative lifetime spend, never auto-downgrades. List tiers from lowest to highest — the higher the threshold, the lower it should sit in the list.</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Tier Name</th><th style="text-align:right">Upgrade Threshold (RM)</th><th style="text-align:right">Earn Rate (pt/RM1)</th><th style="text-align:right">Redeem Rate (RM/pt)</th><th></th></tr></thead>
        <tbody>
          ${(state.config.tiers||[]).map((t,i) => `<tr>
            <td><input type="text" value="${esc(t.name)}" onchange="updateTierField(${i},'name',this.value)"></td>
            <td><input type="number" step="1" min="0" value="${t.threshold}" style="text-align:right" onchange="updateTierField(${i},'threshold',parseFloat(this.value)||0)"></td>
            <td><input type="number" step="0.1" min="0" value="${t.earnRate}" style="text-align:right" onchange="updateTierField(${i},'earnRate',parseFloat(this.value)||0)"></td>
            <td><input type="number" step="0.01" min="0" value="${t.redeemRate}" style="text-align:right" onchange="updateTierField(${i},'redeemRate',parseFloat(this.value)||0)"></td>
            <td><button class="btn-danger" onclick="removeTier(${i})">Delete</button></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
      <button class="btn btn-ghost" style="margin-top:12px" onclick="addTier()">+ Add Tier</button>
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveTiers()">Save Tier Settings</button>
    </div>
    <div class="card">
      <h2>Bundle Promotions</h2>
      <p class="hint">Automatic "buy X, get discount" promotions across a set of products — either a specific list of SKUs, or a whole brand. Applies automatically at checkout once the combined quantity of matching items in the cart reaches the threshold, repeating for every complete set.</p>
      ${(state.config.bundlePromotions||[]).map((bp,i) => `
        <div class="card" style="background:var(--panel);margin-top:${i===0?'0':'12px'}">
          <div class="row">
            <div class="field"><label>Promotion Name</label><input type="text" value="${esc(bp.name||'')}" placeholder="e.g. Mix &amp; Match Attipas" onchange="updateBundlePromo(${i},'name',this.value)"></div>
            <div class="field"><label>Match By</label>
              <select onchange="updateBundlePromo(${i},'matchType',this.value)">
                <option value="sku" ${bp.matchType==='sku'?'selected':''}>Specific SKUs</option>
                <option value="brand" ${bp.matchType==='brand'?'selected':''}>Whole Brand</option>
              </select>
            </div>
          </div>
          <div class="field"><label>${bp.matchType==='brand'?'Brand name (exact match)':'SKUs (comma-separated)'}</label><input type="text" value="${esc((bp.matchValues||[]).join(', '))}" placeholder="${bp.matchType==='brand'?'e.g. Attipas':'e.g. AT-BLK-M, AT-BLK-S, AT-PNK-M'}" onchange="updateBundlePromo(${i},'matchValues',this.value.split(',').map(s=>s.trim()).filter(Boolean))"></div>
          <div class="row3">
            <div class="field"><label>Buy quantity to trigger</label><input type="number" step="1" min="0" value="${bp.qty||''}" onchange="updateBundlePromo(${i},'qty',parseInt(this.value)||0)"></div>
            <div class="field"><label>Discount Type</label>
              <select onchange="updateBundlePromo(${i},'discountType',this.value)">
                <option value="amount" ${bp.discountType==='amount'?'selected':''}>Fixed Amount (RM per set)</option>
                <option value="percent" ${bp.discountType==='percent'?'selected':''}>Percentage (% off that set)</option>
              </select>
            </div>
            <div class="field"><label>Discount value</label><input type="number" step="0.01" min="0" value="${bp.discountValue||''}" onchange="updateBundlePromo(${i},'discountValue',parseFloat(this.value)||0)"></div>
          </div>
          <button class="btn-danger" onclick="removeBundlePromo(${i})">Delete</button>
        </div>`).join('') || '<p class="hint">No bundle promotions yet.</p>'}
      <button class="btn btn-ghost" style="margin-top:12px" onclick="addBundlePromo()">+ Add Bundle Promotion</button>
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveBundlePromos()">Save Bundle Promotions</button>
    </div>
    <div class="card">
      <h2>Admin password</h2>
      <p class="hint">Irreversible actions like clearing all members require entering this password first. Please set a password staff can't easily guess.</p>
      <div class="field"><label>Admin password</label><input id="s-admin-password" type="password" value="${esc(state.config.adminPassword)}" placeholder="Default 0000, please change it soon"></div>
      <button class="btn btn-primary" onclick="saveAdminPassword()">Save Admin Password</button>
    </div>
    <div class="card">
      <h2>Printer Diagnostics</h2>
      <p class="hint">Check whether this device has the native iMin print SDK, no developer tools needed.</p>
      <button class="btn btn-ghost" onclick="checkIminSdkDiagnostic()">Check iMin SDK</button>
      <div id="imin-diagnostic-result" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h2>Staff / Work Cards</h2>
      <p class="hint">The work card number is the barcode scanned for login, checkout, shift open/close, opening the drawer, editing products, and viewing commission records. "Manager" role can view everyone's commission records; staff scanning their card can only see their own.</p>
      <div class="row3" style="align-items:end">
        <div class="field" style="margin-bottom:0"><label>Name</label><input id="s-staff-name" placeholder="e.g. Amy"></div>
        <div class="field" style="margin-bottom:0"><label>Work Card No. / Barcode</label><input id="s-staff-barcode" placeholder="e.g. EMP001"></div>
        <div class="field" style="margin-bottom:0"><label>Role</label>
          <select id="s-staff-role">
            <option value="staff">Staff</option>
            <option value="manager">Manager</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:2px" onclick="addStaff()">Add Staff</button>
      <div class="section-title">Staff List (${state.staff.length})</div>
      <div class="chip-list">${state.staff.map(s => `<div class="chip">${esc(s.name)} ${s.role==='manager'?'<span class="badge badge-gold" style="font-size:9px">Manager</span>':''} <span style="color:var(--ink-soft);font-family:var(--mono);font-size:11px">(${esc(s.barcode)})</span><button onclick="removeStaff('${escAttr(s.id)}')">×</button></div>`).join('') || '<p class="hint">No staff added yet</p>'}</div>
    </div>
  `;
}
function updateTierField(idx, field, value) {
  if (!state.config.tiers || !state.config.tiers[idx]) return;
  state.config.tiers[idx][field] = value;
}
function addTier() {
  state.config.tiers = state.config.tiers || [];
  state.config.tiers.push({ name:'New Tier', threshold:0, earnRate:1, redeemRate:0.1 });
  renderTab();
}
function removeTier(idx) {
  if (!state.config.tiers) return;
  state.config.tiers.splice(idx,1);
  renderTab();
}
async function saveTiers() {
  const prev = JSON.parse(JSON.stringify(state.config.tiers||[]));
  try { await saveConfig(); showToast('Tier settings saved ✓'); renderTab(); }
  catch(e) { state.config.tiers = prev; showToast('Save failed', true); renderTab(); }
}
function updateBundlePromo(idx, field, value) {
  if (!state.config.bundlePromotions || !state.config.bundlePromotions[idx]) return;
  state.config.bundlePromotions[idx][field] = value;
  if (field === 'matchType') renderTab();
}
function addBundlePromo() {
  state.config.bundlePromotions = state.config.bundlePromotions || [];
  state.config.bundlePromotions.push({ name:'New Promotion', matchType:'sku', matchValues:[], qty:2, discountType:'amount', discountValue:0 });
  renderTab();
}
function removeBundlePromo(idx) {
  if (!state.config.bundlePromotions) return;
  state.config.bundlePromotions.splice(idx,1);
  renderTab();
}
async function saveBundlePromos() {
  const prev = JSON.parse(JSON.stringify(state.config.bundlePromotions||[]));
  try { await saveConfig(); showToast('Bundle promotions saved ✓'); renderTab(); }
  catch(e) { state.config.bundlePromotions = prev; showToast('Save failed', true); renderTab(); }
}
async function saveAdminPassword() {
  const pw = document.getElementById('s-admin-password').value.trim();
  if (!pw) return showToast('Password cannot be blank', true);
  const prev = state.config.adminPassword;
  state.config.adminPassword = pw;
  try { await saveConfig(); showToast('Admin password updated ✓'); } catch(e) { state.config.adminPassword = prev; showToast('Save failed', true); render(); }
}
async function saveShopInfo() {
  state.config.shopName = document.getElementById('s-shopname').value.trim() || 'Tinker Toddler';
  state.config.addressLine1 = document.getElementById('s-address1').value.trim();
  state.config.addressLine2 = document.getElementById('s-address2').value.trim();
  state.config.addressLine3 = document.getElementById('s-address3').value.trim();
  state.config.phone = document.getElementById('s-phone').value.trim();
  state.config.sstNo = document.getElementById('s-sst').value.trim();
  state.config.paperWidth = document.getElementById('s-paperwidth').value;
  try { await saveConfig(); showToast('Saved ✓'); render(); } catch(e){ showToast('Save failed', true); }
}
async function savePointsRules() {
  const earn = parseFloat(document.getElementById('s-earn').value); const redeem = parseFloat(document.getElementById('s-redeem').value);
  if (isNaN(earn)||isNaN(redeem)||earn<0||redeem<0) return showToast('Please enter a valid number', true);
  state.config.pointsPerRM = earn; state.config.pointValueRM = redeem;
  try { await saveConfig(); showToast('Points rules saved ✓'); renderTab(); } catch(e){ showToast('Save failed', true); }
}
async function addStaff() {
  const name = document.getElementById('s-staff-name').value.trim(); const barcode = document.getElementById('s-staff-barcode').value.trim();
  const role = document.getElementById('s-staff-role').value;
  if (!name||!barcode) return showToast('Please fill in name and work card number', true);
  if (state.staff.some(s=>s.barcode.toLowerCase()===barcode.toLowerCase())) return showToast('This work card number already exists', true);
  const staff = { id:'stf_'+Date.now(), name, barcode, role };
  state.staff.push(staff);
  try { await gasUpsert('Staff', staffToRow(staff)); showToast('Staff added ✓'); renderTab(); } catch(e) { state.staff.pop(); showToast('Save failed', true); }
}
async function removeStaff(id) {
  const idx = state.staff.findIndex(s=>s.id===id); if (idx===-1) return; const removed = state.staff.splice(idx,1)[0];
  try { await gasDelete('Staff', id); showToast('Staff removed'); renderTab(); } catch(e) { state.staff.splice(idx,0,removed); showToast('Save failed', true); }
}

loadAll();
</script>
